<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Thai Asia Map</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thai Asia Map" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <style>
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f3f3f3;
    }

    body {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f6f7fb;
      box-sizing: border-box;
    }

    .auth-overlay.hidden {
      display: none;
    }

    .auth-card {
      width: min(340px, 100%);
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, .18);
      box-sizing: border-box;
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .auth-input {
      width: 100%;
      height: 42px;
      border: 1px solid #d6d9df;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .auth-button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #f27618;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-error {
      display: none;
      color: #c62828;
      font-size: 13px;
      margin-top: 10px;
    }

    .auth-error.show {
      display: block;
    }

    .top-panel {
      position: fixed;
      right: 10px;
      top: calc(10px + env(safe-area-inset-top));
      z-index: 1000;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 7px;
      max-width: calc(100vw - 20px);
      pointer-events: none;
    }

    .summary-pill {
      background: rgba(255, 255, 255, .96);
      padding: 8px 10px;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .18);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: auto;
      flex-shrink: 0;
    }

    .summary-pill b {
      font-size: 14px;
      margin-right: 3px;
    }

    .order-summary {
      color: #111;
      transition: background-color .15s ease, color .15s ease;
    }

    .order-summary.has-orders {
      background: #FF2400;
      color: #fff;
    }

    .order-summary.no-orders {
      background: #00FF00;
      color: #111;
    }

    .top-shipper-list {
      width: max-content;
      min-width: 0;
      max-width: calc(100vw - 110px);
      max-height: min(42vh, 260px);
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(255, 255, 255, .96);
      border-radius: 12px;
      padding: 6px 10px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .18);
      box-sizing: border-box;
      pointer-events: auto;
    }

    .filter-button {
      position: fixed;
      right: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 1100;
      border: 0;
      background: #fff;
      border-radius: 999px;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .22);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .filter-panel {
      position: fixed;
      right: 12px;
      bottom: calc(64px + env(safe-area-inset-bottom));
      z-index: 1100;
      width: min(285px, calc(100vw - 24px));
      background: rgba(255, 255, 255, .98);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 5px 22px rgba(0, 0, 0, .23);
      display: none;
      box-sizing: border-box;
    }

    .filter-panel.open {
      display: block;
    }

    .filter-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .filter-zoom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      margin-bottom: 12px;
      padding-bottom: 10px;
      font-size: 14px;
    }

    .filter-zoom-row b {
      font-size: 16px;
    }

    .field-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      height: 38px;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 0 9px;
      background: #fff;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      font-size: 14px;
    }

    .update-row {
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 10px;
      font-size: 12px;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    .order-marker {
      --order-color: #f27618;
      position: relative;
      width: 64px;
      height: 58px;
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      line-height: 15px;
    }

    .order-marker-panel {
      position: absolute;
      top: 0;
      left: 50%;
      min-width: 52px;
      min-height: 40px;
      padding: 5px 7px;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 11px;
      background: var(--order-color);
      color: #fff;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .22);
      box-sizing: border-box;
      transform: translateX(-50%);
    }

    .order-marker.route-ready .order-marker-panel {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, .3), 0 4px 14px rgba(127, 29, 29, .34);
    }

    .order-marker.route-ready .order-marker-pointer {
      border-top-color: #ef4444;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .16)) drop-shadow(0 0 4px rgba(239, 68, 68, .5));
    }

    .order-marker.route-ready .order-marker-dot {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, .26), 0 1px 5px rgba(0, 0, 0, .24);
    }

    .order-marker-pointer {
      position: absolute;
      left: 50%;
      top: 39px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid rgba(255, 255, 255, .95);
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .16));
      transform: translateX(-50%);
    }

    .order-marker-pointer::after {
      content: "";
      position: absolute;
      left: -4px;
      top: -8px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 6px solid var(--order-color);
    }

    .order-marker-dot {
      position: absolute;
      left: 50%;
      top: 46px;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 50%;
      background: var(--order-color);
      box-shadow: 0 1px 5px rgba(0, 0, 0, .24);
      box-sizing: border-box;
      transform: translateX(-50%);
    }

    .order-new {
      --order-color: #FF0000;
    }

    .order-inprocess {
      --order-color: #035ccf;
    }

    .order-inprocess-scheduled {
      --order-color: #7e04d5;
    }

    .order-complete {
      --order-color: #179b4c;
    }

    .order-complete-scheduled {
      --order-color: #179b4c;
    }

    .order-complete-scheduled .order-marker-panel {
      background: #179b4c;
      color: #7e04d5;
      border: 2px solid #7e04d5;
      text-shadow: 0 0 2px #ffffff, 0 0 3px #ffffff, 0 0 1px #ffffff;
    }

    .order-complete-scheduled .order-marker-pointer {
      border-top-color: #7e04d5;
    }

    .order-complete-scheduled .order-marker-pointer::after {
      border-top-color: #179b4c;
    }

    .order-complete-scheduled .order-marker-dot {
      background: #179b4c;
      border-color: #7e04d5;
    }

    .order-cancel {
      --order-color: #777;
    }

    .restaurant-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #d71920;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .32);
      box-sizing: border-box;
    }

    .shipper-list {
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 9px;
    }

    .top-shipper-list .shipper-list {
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }

    .shipper-list-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .shipper-person-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      font-size: 13px;
      white-space: nowrap;
    }

    .shipper-person-row input {
      margin: 0;
    }

    .shipper-person-row .name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .shipper-focus-row {
      cursor: pointer;
      border-radius: 8px;
    }

    .shipper-focus-row:active {
      background: rgba(242, 118, 24, .12);
    }

    .shipper-person-row.following {
      background: rgba(3, 92, 207, .12);
      box-shadow: 0 0 0 1.5px rgba(3, 92, 207, .35);
      border-radius: 8px;
    }

    .shipper-eta {
      font-size: 11px;
      font-weight: 700;
      color: #d95300;
      background: #fff0e6;
      border: 1px solid #ffd8c2;
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .shipper-eta.at-shop {
      color: #179b4c;
      background: #eafaf1;
      border-color: #b7eed0;
    }

    .shipper-age {
      color: #8a8f9a;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 2px;
    }

    .setting-shipper-list {
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 10px;
    }

    .map-bottom-controls {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .map-bottom-controls button {
      width: 28px;
      height: 28px;
      border: 1px solid #cfcfcf;
      background: rgba(255, 255, 255, .97);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
      color: #222;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .map-bottom-controls .reload-button {
      width: 38px;
      height: 38px;
      font-size: 19px;
    }

    .map-bottom-controls .reload-button.loading {
      animation: spinReload .8s linear infinite;
      background: #eef6ff;
      border-color: #6aa8ff;
    }

    @keyframes spinReload {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .shipper-car-marker {
      width: 16px;
      height: 32px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shipper-car-body {
      width: 16px;
      height: 32px;
      transform-origin: center center;
      transition: transform .6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .4));
    }

    .shipper-car-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      filter: brightness(1.15) saturate(1.3);
    }

    .shipper-car-offline {
      filter: grayscale(1) opacity(0.45) drop-shadow(0 1px 3px rgba(0, 0, 0, .2));
    }

    .shipper-list-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 6px;
      flex-shrink: 0;
      line-height: 1;
    }

    .shipper-side-car-img {
      display: block;
      width: 26px;
      height: auto;
      max-height: 12px;
      object-fit: contain;
      transform: scaleX(-1);
      filter: brightness(1.12) saturate(1.25) drop-shadow(0 1px 2px rgba(0, 0, 0, .25));
    }

    .shipper-side-car-img.offline {
      filter: grayscale(1) opacity(0.45) !important;
      transform: scaleX(-1);
    }

    .shipper-icon {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 50%;
      background: #f27618;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .24);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      line-height: 1;
    }

    .popup-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .order-popup-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
      padding-right: 20px;
    }

    .order-popup-header .popup-title {
      margin-bottom: 0;
    }

    .order-popup-time {
      font-size: 12px;
      color: #555;
      font-weight: normal;
      white-space: nowrap;
    }

    .popup-line {
      margin: 2px 0;
    }

    .order-popup {
      width: 100%;
      max-width: min(390px, calc(100vw - 36px));
      max-height: min(74vh, calc(100vh - 160px));
      overflow-y: auto;
      padding-right: 4px;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    .order-popup::-webkit-scrollbar {
      width: 5px;
    }

    .order-popup::-webkit-scrollbar-track {
      background: transparent;
    }

    .order-popup::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 4px;
    }

    .order-popup::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.38);
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .24);
    }

    .leaflet-popup-content {
      margin: 14px 14px 12px 14px;
      line-height: 1.4;
    }

    .leaflet-container a.leaflet-popup-close-button {
      top: 8px;
      right: 8px;
      padding: 4px;
      color: #888;
      font-size: 18px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 50%;
      transition: background 0.15s, color 0.15s;
    }

    .leaflet-container a.leaflet-popup-close-button:hover,
    .leaflet-container a.leaflet-popup-close-button:active {
      background: #eee;
      color: #222;
    }

    .popup-section-title {
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .popup-note {
      background: #fffbe8;
      border: 1px solid #f2dc73;
      border-radius: 8px;
      padding: 7px 8px;
      line-height: 1.35;
    }

    .popup-items {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .popup-item {
      background: #f6f7f9;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      line-height: 1.35;
    }

    .popup-item-name {
      color: #1e293b;
      word-break: break-word;
    }

    .popup-item-name b {
      color: #0f172a;
      font-weight: 700;
    }

    .popup-item-note {
      color: #d95300;
      font-weight: 600;
    }

    /* Route Panel */
    .route-panel {
      position: fixed;
      left: 10px;
      bottom: calc(56px + env(safe-area-inset-bottom));
      width: min(350px, calc(100vw - 20px));
      max-height: min(260px, 38vh);
      background: rgba(255, 255, 255, .97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .2);
      z-index: 1050;
      display: none;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    .route-panel.show {
      display: flex;
      animation: slideUpFade 0.2s ease-out;
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .route-close-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.05);
      border: 0;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .route-close-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .route-body {
      padding: 8px 9px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .route-top-row {
      display: flex;
      align-items: center;
      justify-content: stretch;
      padding-right: 26px;
      flex-wrap: nowrap;
    }

    .route-top-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .route-mini-action-btn {
      width: 100%;
      height: 27px;
      padding: 0 6px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      white-space: nowrap;
      transition: background .15s, opacity .15s;
    }

    .route-mini-action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .route-mini-action-btn.optimize {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .route-mini-action-btn.optimize:not(:disabled):hover {
      background: #d1fae5;
      color: #065f46;
    }

    .route-mini-action-btn.primary {
      background: #ede9fe;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
    }

    .route-mini-action-btn.primary:not(:disabled):hover {
      background: #ddd6fe;
    }

    .route-mini-action-btn.danger {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .route-mini-action-btn.danger:not(:disabled):hover {
      background: #fecaca;
    }

    /* Route Summary Box */
    .route-summary-box {
      background: #fbfbfe;
      border: 1px solid #e0e7ff;
      border-radius: 9px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 1px 4px rgba(124, 58, 237, 0.05);
    }

    .route-summary-box.hidden {
      display: none;
    }

    .route-summary-main {
      display: flex;
      justify-content: space-around;
      text-align: center;
      border-bottom: 1px dashed #c7d2fe;
      padding-bottom: 4px;
    }

    .route-summary-stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .stat-label {
      font-size: 9px;
      color: #6366f1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-val {
      font-size: 14px;
      color: #7c3aed;
      font-weight: 800;
    }

    .route-legs-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: #3730a3;
      line-height: 1.3;
      max-height: 95px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .route-legs-list::-webkit-scrollbar {
      width: 3px;
    }
    .route-legs-list::-webkit-scrollbar-thumb {
      background: #c4b5fd;
      border-radius: 3px;
    }

    .route-leg-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 1px 0;
    }

    .route-leg-label {
      font-size: 11px;
      color: #3730a3;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-swap-inline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 19px;
      padding: 0 6px;
      background: #ede9fe;
      color: #6d28d9;
      border: 1px solid #c4b5fd;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .route-swap-inline-btn:hover {
      background: #7c3aed;
      color: #ffffff;
      border-color: #6d28d9;
      box-shadow: 0 2px 5px rgba(124, 58, 237, 0.25);
    }

    .route-swap-inline-btn:active {
      transform: scale(0.95);
    }

    .route-leg-stat {
      font-size: 10.5px;
      color: #3730a3;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Floating Route Suggestion Banner (Hàng 12 giờ) */
    .route-suggestion-banner {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1050;
      background: linear-gradient(135deg, rgba(255, 237, 213, 0.98), rgba(255, 255, 255, 0.98));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid #f97316;
      border-radius: 24px;
      padding: 7px 14px;
      box-shadow: 0 10px 30px rgba(249, 115, 22, 0.34), 0 3px 10px rgba(124, 45, 18, 0.14);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      max-width: min(calc(100vw - 140px), 420px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      animation: suggestionBannerSlide 0.25s ease-out;
      user-select: none;
    }

    .route-suggestion-banner:hover {
      transform: translateX(-50%) translateY(-1px);
      box-shadow: 0 12px 34px rgba(249, 115, 22, 0.44), 0 4px 12px rgba(124, 45, 18, 0.18);
      border-color: #ea580c;
    }

    .route-suggestion-banner.hidden {
      display: none;
    }

    .route-suggestion-banner.optimal {
      border-color: #16a34a;
      background: linear-gradient(135deg, rgba(220, 252, 231, 0.98), rgba(255, 255, 255, 0.98));
      box-shadow: 0 10px 28px rgba(22, 163, 74, 0.34), 0 3px 10px rgba(20, 83, 45, 0.14);
      cursor: default;
    }

    @keyframes suggestionBannerSlide {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .suggestion-icon {
      font-size: 17px;
      flex-shrink: 0;
    }

    .suggestion-content {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: #7c2d12;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-label {
      font-weight: 900;
      color: #c2410c;
    }

    .route-suggestion-banner.optimal .suggestion-label {
      color: #15803d;
    }

    .suggestion-path {
      font-weight: 900;
      color: #9a3412;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .route-suggestion-banner.optimal .suggestion-path {
      color: #166534;
    }

    .suggestion-order-tag {
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fdba74;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 900;
      font-size: 12px;
    }

    .route-suggestion-banner.optimal .suggestion-order-tag {
      background: #f0fdf4;
      color: #15803d;
      border-color: #86efac;
    }

    .suggestion-arrow {
      color: #ea580c;
      font-size: 12px;
      margin: 0 1px;
    }

    .route-suggestion-banner.optimal .suggestion-arrow {
      color: #16a34a;
    }

    .suggestion-apply-btn {
      height: 24px;
      padding: 0 11px;
      background: linear-gradient(135deg, #f97316, #dc2626);
      color: #ffffff;
      border: 0;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .suggestion-apply-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 3px 10px rgba(220, 38, 38, 0.38);
    }

    .suggestion-apply-btn:active {
      transform: scale(0.95);
    }

    /* Floating Toast Feedback */
    .map-toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      z-index: 4000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      white-space: nowrap;
    }

    .map-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Popup Button toggle route */
    .btn-toggle-route {
      width: 100%;
      height: 32px;
      margin-top: 8px;
      background: #f5f3ff;
      border: 1px solid #ddd6fe;
      color: #7c3aed;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .btn-toggle-route:hover {
      background: #ede9fe;
    }

    .btn-toggle-route.in-route {
      background: #fee2e2;
      border-color: #fecaca;
      color: #dc2626;
    }

    .btn-toggle-route.in-route:hover {
      background: #fecaca;
    }

    /* Numbered Waypoint Badge Icon on Map (3D High-Contrast Neon) */
    .waypoint-badge-marker {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .4), 0 0 0 1px rgba(109, 40, 217, 0.4);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .waypoint-badge-marker:hover {
      transform: scale(1.15);
    }

    .route-moving-arrow-svg {
      fill: #ffffff;
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 4px rgba(168, 85, 247, 0.9));
      pointer-events: none;
      will-change: transform;
    }

    /* Flowing Navigation Stream on Route Polyline */
    .route-flowing-line {
      stroke-dasharray: 10, 18;
      stroke-dashoffset: 0;
      pointer-events: none !important;
    }

    @media (min-width: 769px) {
      .top-panel {
        right: 20px;
        top: 20px;
      }

      .filter-button {
        right: 20px;
        bottom: 20px;
      }

      .filter-panel {
        right: 20px;
        bottom: 72px;
      }

      .route-panel {
        left: 20px;
        bottom: 68px;
      }

      .map-bottom-controls {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>
  <div id="authOverlay" class="auth-overlay hidden">
    <form id="authForm" class="auth-card">
      <div class="auth-title">Thai Asia Map</div>
      <input id="authPassword" class="auth-input" type="password" placeholder="Mật khẩu"
        autocomplete="current-password" />
      <button class="auth-button" type="submit">Vào app</button>
      <div id="authError" class="auth-error">Sai mật khẩu</div>
    </form>
  </div>

  <div id="map"></div>

  <div class="top-panel">
    <div id="orderSummary" class="summary-pill order-summary no-orders"><b id="orderCount">0</b> đơn</div>

    <div class="top-shipper-list">
      <div class="shipper-list">
        <div id="shipperStatusList">
          <div style="font-size:12px;color:#999;padding:5px 0;">Đang tải...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="routeSuggestionBanner" class="route-suggestion-banner hidden" onclick="applySuggestedRouteOrder()" title="Bấm để áp dụng gợi ý xếp đơn này">
    <div class="suggestion-icon">💡</div>
    <div class="suggestion-content">
      <span id="suggestionLabel" class="suggestion-label">Gợi ý xếp đơn:</span>
      <span id="suggestionPath" class="suggestion-path">—</span>
    </div>
    <button id="suggestionApplyBtn" class="suggestion-apply-btn" type="button" onclick="event.stopPropagation(); applySuggestedRouteOrder();">Áp dụng</button>
  </div>

  <div id="routePanel" class="route-panel">
    <button id="routeCloseButton" class="route-close-btn" type="button" title="Đóng">✕</button>

    <div class="route-body">
      <div class="route-top-row">
        <div class="route-top-actions">
          <button id="routeOptimizeBtn" class="route-mini-action-btn optimize" type="button" title="Gợi ý & tự động tối ưu thứ tự giao" disabled>✨ Tối ưu</button>
          <button id="routeFitViewBtn" class="route-mini-action-btn primary" type="button" title="Xem toàn cảnh lộ trình" disabled>🔍 Toàn cảnh</button>
          <button id="routeClearBtn" class="route-mini-action-btn danger" type="button" title="Xóa toàn bộ lộ trình" disabled>🗑️ Xóa</button>
        </div>
      </div>

      <div id="routeSummaryBox" class="route-summary-box hidden">
        <div class="route-summary-main">
          <div class="route-summary-stat">
            <span class="stat-label">Tổng quãng đường</span>
            <b id="routeTotalDist" class="stat-val">—</b>
          </div>
          <div class="route-summary-stat">
            <span class="stat-label">Tổng thời gian</span>
            <b id="routeTotalTime" class="stat-val">—</b>
          </div>
        </div>
        <div id="routeLegsList" class="route-legs-list"></div>
      </div>
    </div>
  </div>

  <div id="mapToast" class="map-toast"></div>

  <div class="map-bottom-controls" aria-label="Điều khiển bản đồ">
    <button id="reloadButton" class="reload-button" type="button" title="Tải lại trang">↻</button>
  </div>

  <button id="filterButton" class="filter-button" type="button" title="Bộ lọc" aria-label="Bộ lọc">⚙</button>

  <div id="filterPanel" class="filter-panel">
    <div class="filter-title">Setting</div>

    <div class="filter-zoom-row">
      <span>Zoom</span>
      <b id="currentZoom">0</b>
    </div>

    <div class="field-label">Trạng thái đơn</div>
    <select id="statusFilter">
      <option value="all">Tất cả</option>
      <option value="inprocess" selected>Tiếp nhận &amp; Mới</option>
      <option value="new">Chỉ đơn mới</option>
      <option value="complete">Hoàn thành</option>
      <option value="cancel">Hủy</option>
    </select>

    <label class="toggle-row">
      <span>Hiện đơn hàng</span>
      <input id="showOrders" type="checkbox" checked />
    </label>

    <label class="toggle-row">
      <span>Hiện shipper</span>
      <input id="showShippers" type="checkbox" checked />
    </label>

    <label class="toggle-row">
      <span>Hiện giao thông</span>
      <input id="showTraffic" type="checkbox" checked />
    </label>

    <div class="setting-shipper-list">
      <div class="shipper-list-title">Tất cả shipper</div>
      <div id="shipperSettingList">
        <div style="font-size:12px;color:#999;padding:5px 0;">Đang tải...</div>
      </div>
    </div>

    <div class="update-row">
      <span>Cập nhật dữ liệu</span>
      <span id="lastUpdate">—</span>
    </div>

    <div class="update-row" style="margin-top: 6px; border-top: 1px dashed #eee; padding-top: 8px;">
      <span>Phiên bản</span>
      <span style="font-weight: 700; color: #7c3aed;">v62</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    const API_BASE = "https://api.thaiasiasushibar.de/api";
    // Đổi mật khẩu tại đây. Sau khi đổi và push/deploy, thiết bị cũ sẽ phải nhập lại.
    let APP_PASSWORD = "12345";
    const AUTH_STORAGE_KEY = "thaiasia.map.authToken";

    // Bật/tắt hiển thị "Tổng: ... €" trong thông tin đơn hàng (true = bật, false = tắt)
    let SHOW_ORDER_TOTAL = false;

    // 20 giây/lần. Khi tab/app chạy nền sẽ tự dừng.
    const REFRESH_MS = 20000;
    const RESUME_RELOAD_MS = 1500;
    const ROUTE_ESTIMATE_DISTANCE_FACTOR = 1.35;
    const ROUTE_ESTIMATE_SPEED_M_PER_MIN = 500;
    const ROUTE_STOP_SERVICE_MIN = 2.5;
    const ROUTE_SCHEDULE_GRACE_MIN = 15;
    const ROUTE_NORMAL_WAIT_TARGET_MIN = 28;
    const ROUTE_NORMAL_WAIT_LIMIT_MIN = 35;
    const ROUTE_OSRM_TABLE_URL = "https://router.project-osrm.org/table/v1/driving";

    // Thai Asia SushiBar, Leipziger Chaussee 147, Halle (Saale)
    const RESTAURANT = {
      name: "Thai Asia SushiBar",
      lat: 51.4547,
      lng: 12.01689
    };

    const DEFAULT_ZOOM_WEB = 12;
    const DEFAULT_ZOOM_ANDROID = 12;
    const DEFAULT_ZOOM_IPHONE = 11;
    const SHIPPER_FOCUS_ZOOM = 15;
    const ORDER_FOCUS_ZOOM = 12;

    function getDefaultZoom() {
      const platform = navigator.userAgent || navigator.platform || "";

      if (/iPhone|iPad|iPod/i.test(platform)) {
        return DEFAULT_ZOOM_IPHONE;
      }

      if (/Android/i.test(platform)) {
        return DEFAULT_ZOOM_ANDROID;
      }

      return DEFAULT_ZOOM_WEB;
    }

    // Mỗi lần mở trang, map luôn bắt đầu tại quán.
    // Dữ liệu đơn/shipper tải xong sẽ KHÔNG tự kéo map sang chỗ khác.
    const map = L.map("map", {
      zoomControl: false
    }).setView([RESTAURANT.lat, RESTAURANT.lng], getDefaultZoom());

    function setExactMapDimensions() {
      const mapEl = document.getElementById("map");
      const w = window.innerWidth || document.documentElement.clientWidth || screen.width;
      const h = window.innerHeight || document.documentElement.clientHeight || screen.height;
      if (mapEl && w && h) {
        mapEl.style.width = w + "px";
        mapEl.style.height = h + "px";
      }
      if (map) {
        map.invalidateSize({ debounceMoveend: true });
      }
    }

    window.addEventListener("resize", setExactMapDimensions);
    window.addEventListener("orientationchange", () => {
      setTimeout(setExactMapDimensions, 60);
      setTimeout(setExactMapDimensions, 200);
      setTimeout(setExactMapDimensions, 500);
      setTimeout(setExactMapDimensions, 900);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", setExactMapDimensions);
    }
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        setTimeout(setExactMapDimensions, 50);
      }
    });

    if (typeof ResizeObserver !== "undefined") {
      try {
        const ro = new ResizeObserver(() => {
          setExactMapDimensions();
        });
        ro.observe(document.documentElement);
        ro.observe(document.body);
      } catch (e) {}
    }

    setTimeout(setExactMapDimensions, 50);
    setTimeout(setExactMapDimensions, 250);
    setTimeout(setExactMapDimensions, 600);

    function resetMapToRestaurant() {
      stopFollowShipper();
      map.setView([RESTAURANT.lat, RESTAURANT.lng], getDefaultZoom());
    }

    function getGoogleMapTileUrl(withTraffic) {
      const lyr = withTraffic ? "m,traffic" : "m";
      const scale = (typeof window !== "undefined" && window.devicePixelRatio && window.devicePixelRatio >= 1.5) ? 2 : 1;
      return `https://{s}.google.com/vt/lyrs=${lyr}&x={x}&y={y}&z={z}&scale=${scale}`;
    }

    const isTrafficEnabled = localStorage.getItem("thaiasia.showTraffic") !== "0";

    const baseTileLayer = L.tileLayer(getGoogleMapTileUrl(isTrafficEnabled), {
      maxZoom: 20,
      subdomains: ["mt0", "mt1", "mt2", "mt3"],
      tileSize: 256,
      updateWhenZooming: true,
      updateWhenIdle: false
    }).addTo(map);

    const orderLayer = L.layerGroup().addTo(map);
    const shipperLayer = L.layerGroup().addTo(map);
    const routeLayerGroup = L.layerGroup().addTo(map);

    let routeOrderKeys = [];
    let isRoutingArmed = false;
    let lastInteractedOrderKey = null;
    let routeStartType = null;
    let routeReturnToShop = false;
    let routePolylineOutline = null;
    let routePolylineInner = null;
    let routeAnimationId = null;
    let movingArrowMarkers = [];
    let routeDrawRequestId = 0;
    let routeAnalysisRenderId = 0;
    let routeAnalysisCache = null;

    let openedOrderKey = null;
    let isRefreshingOrders = false;
    let lastOrders = [];
    let lastShippers = [];
    const knownOrdersMap = new Map();

    const restaurantIcon = L.divIcon({
      className: "",
      html: '<div class="restaurant-icon">🏪</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

    const restaurantMarker = L.marker([RESTAURANT.lat, RESTAURANT.lng], {
      icon: restaurantIcon,
      zIndexOffset: 0
    })
      .bindPopup("<b>Thai Asia SushiBar</b><br>Leipziger Chaussee 147")
      .addTo(map);

    restaurantMarker.on("click", () => {
      routeStartType = "restaurant";
      routeReturnToShop = false;
      isRoutingArmed = true;
      lastInteractedOrderKey = null;
      updateRouteReadyOrderMarkerUi();
      if (routeOrderKeys.length > 0) {
        calculateAndDrawRoute();
        toggleRoutePanel(true);
      }
    });

    let refreshTimer = null;
    let refreshing = false;

    const STATUS_FILTER_KEY = "thaiasia.statusFilter";
    const SHOW_ORDERS_KEY = "thaiasia.showOrders";
    const SHOW_SHIPPERS_KEY = "thaiasia.showShippers";
    const SHIPPER_VISIBILITY_KEY = "thaiasia.shipperVisibility";

    // Lưu trạng thái bật/tắt từng shipper.
    const shipperVisibility = loadShipperVisibility();
    let appUnlocked = false;

    const els = {
      authOverlay: document.getElementById("authOverlay"),
      authForm: document.getElementById("authForm"),
      authPassword: document.getElementById("authPassword"),
      authError: document.getElementById("authError"),
      filterButton: document.getElementById("filterButton"),
      filterPanel: document.getElementById("filterPanel"),
      routeButton: document.getElementById("routeButton"),
      routeBadge: document.getElementById("routeBadge"),
      routePanel: document.getElementById("routePanel"),
      routeCloseButton: document.getElementById("routeCloseButton"),
      routeSummaryBox: document.getElementById("routeSummaryBox"),
      routeTotalDist: document.getElementById("routeTotalDist"),
      routeTotalTime: document.getElementById("routeTotalTime"),
      routeLegsList: document.getElementById("routeLegsList"),
      routeOptimizeBtn: document.getElementById("routeOptimizeBtn"),
      routeFitViewBtn: document.getElementById("routeFitViewBtn"),
      routeClearBtn: document.getElementById("routeClearBtn"),
      routeSuggestionBanner: document.getElementById("routeSuggestionBanner"),
      suggestionLabel: document.getElementById("suggestionLabel"),
      suggestionPath: document.getElementById("suggestionPath"),
      suggestionApplyBtn: document.getElementById("suggestionApplyBtn"),
      mapToast: document.getElementById("mapToast"),
      statusFilter: document.getElementById("statusFilter"),
      showOrders: document.getElementById("showOrders"),
      showShippers: document.getElementById("showShippers"),
      showTraffic: document.getElementById("showTraffic"),
      reloadButton: document.getElementById("reloadButton"),
      orderSummary: document.getElementById("orderSummary"),
      orderCount: document.getElementById("orderCount"),
      currentZoom: document.getElementById("currentZoom"),
      shipperStatusList: document.getElementById("shipperStatusList"),
      shipperSettingList: document.getElementById("shipperSettingList"),
      lastUpdate: document.getElementById("lastUpdate")
    };

    // Khôi phục bộ lọc trạng thái và hiển thị đã lưu
    const savedStatusFilter = localStorage.getItem(STATUS_FILTER_KEY);
    if (savedStatusFilter && els.statusFilter.querySelector(`option[value="${savedStatusFilter}"]`)) {
      els.statusFilter.value = savedStatusFilter;
    } else {
      els.statusFilter.value = "inprocess";
    }

    if (localStorage.getItem(SHOW_ORDERS_KEY) !== null) {
      els.showOrders.checked = localStorage.getItem(SHOW_ORDERS_KEY) !== "0";
      if (!els.showOrders.checked && map.hasLayer(orderLayer)) {
        map.removeLayer(orderLayer);
      }
    }

    if (localStorage.getItem(SHOW_SHIPPERS_KEY) !== null) {
      els.showShippers.checked = localStorage.getItem(SHOW_SHIPPERS_KEY) !== "0";
      if (!els.showShippers.checked && map.hasLayer(shipperLayer)) {
        map.removeLayer(shipperLayer);
      }
    }

    function updateZoomDisplay() {
      els.currentZoom.textContent = String(map.getZoom());
    }

    map.on("zoomend", updateZoomDisplay);
    updateZoomDisplay();

    function hashString(value) {
      let hash = 2166136261;
      const text = String(value);
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16);
    }

    function getAuthToken() {
      return hashString(`thaiasia:${APP_PASSWORD}`);
    }

    function hasSavedAccess() {
      try {
        return localStorage.getItem(AUTH_STORAGE_KEY) === getAuthToken();
      } catch (err) {
        return false;
      }
    }

    function lockApp(reasonMessage) {
      appUnlocked = false;
      stopPolling();
      orderLayer.clearLayers();
      shipperLayer.clearLayers();
      if (typeof clearRoute === "function") clearRoute();
      els.authOverlay.classList.remove("hidden");
      if (reasonMessage) {
        els.authError.textContent = reasonMessage;
        els.authError.classList.add("show");
      } else {
        els.authError.classList.remove("show");
      }
      els.authPassword.value = "";
      setTimeout(() => els.authPassword.focus(), 0);
    }

    function unlockApp() {
      appUnlocked = true;
      els.authOverlay.classList.add("hidden");
      els.authError.classList.remove("show");
      els.authPassword.value = "";
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }
      setTimeout(() => {
        setExactMapDimensions();
        startPolling();
      }, 60);
      setTimeout(setExactMapDimensions, 250);
      setTimeout(setExactMapDimensions, 600);
    }

    async function syncLatestPassword() {
      try {
        const res = await fetch(`index.html?_t=${Date.now()}`, {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache" }
        });
        if (!res.ok) return true;
        const text = await res.text();
        const match = text.match(/(?:const|let)\s+APP_PASSWORD\s*=\s*["']([^"']+)["']/);
        if (match && match[1]) {
          const serverPassword = match[1];
          if (serverPassword !== APP_PASSWORD) {
            APP_PASSWORD = serverPassword;
            if (!hasSavedAccess()) {
              lockApp("Mật khẩu đã được thay đổi. Vui lòng nhập mật khẩu mới.");
              return false;
            }
          }
        }
      } catch (err) {
        // Bỏ qua lỗi kết nối khi offline
      }
      return true;
    }

    let lastHiddenAt = 0;
    let isResuming = false;

    async function handleAppResume() {
      if (document.hidden || isResuming) return;
      isResuming = true;

      try {
        const shouldReloadOnResume = lastHiddenAt > 0 && (Date.now() - lastHiddenAt > RESUME_RELOAD_MS);
        lastHiddenAt = 0;

        if ("serviceWorker" in navigator) {
          try {
            const reg = await navigator.serviceWorker.getRegistration();
            if (reg) await reg.update();
          } catch (e) {}
        }

        if (shouldReloadOnResume) {
          window.location.reload();
          return;
        }

        if (!hasSavedAccess()) {
          lockApp();
          return;
        }

        const isStillValid = await syncLatestPassword();
        if (!isStillValid || !hasSavedAccess()) {
          return;
        }

        if (!appUnlocked) {
          unlockApp();
        } else {
          startPolling();
        }
      } finally {
        isResuming = false;
      }
    }
