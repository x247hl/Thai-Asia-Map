<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Thai Asia Map</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thai Asia Map" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <style>
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f3f3f3;
    }

    body {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f6f7fb;
      box-sizing: border-box;
    }

    .auth-overlay.hidden {
      display: none;
    }

    .auth-card {
      width: min(340px, 100%);
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, .18);
      box-sizing: border-box;
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .auth-input {
      width: 100%;
      height: 42px;
      border: 1px solid #d6d9df;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .auth-button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #f27618;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-error {
      display: none;
      color: #c62828;
      font-size: 13px;
      margin-top: 10px;
    }

    .auth-error.show {
      display: block;
    }

    .top-panel {
      position: fixed;
      right: 10px;
      top: calc(10px + env(safe-area-inset-top));
      z-index: 1000;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 7px;
      max-width: calc(100vw - 20px);
      pointer-events: none;
    }

    .summary-pill {
      background: rgba(255, 255, 255, .96);
      padding: 8px 10px;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .18);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: auto;
      flex-shrink: 0;
    }

    .summary-pill b {
      font-size: 14px;
      margin-right: 3px;
    }

    .order-summary {
      color: #111;
      transition: background-color .15s ease, color .15s ease;
    }

    .order-summary.has-orders {
      background: #FF2400;
      color: #fff;
    }

    .order-summary.no-orders {
      background: #00FF00;
      color: #111;
    }

    .top-shipper-list {
      width: max-content;
      min-width: 0;
      max-width: calc(100vw - 110px);
      max-height: min(42vh, 260px);
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(255, 255, 255, .96);
      border-radius: 12px;
      padding: 6px 10px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .18);
      box-sizing: border-box;
      pointer-events: auto;
    }

    .filter-button {
      position: fixed;
      right: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 1100;
      border: 0;
      background: #fff;
      border-radius: 999px;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .22);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .filter-panel {
      position: fixed;
      right: 12px;
      bottom: calc(64px + env(safe-area-inset-bottom));
      z-index: 1100;
      width: min(285px, calc(100vw - 24px));
      background: rgba(255, 255, 255, .98);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 5px 22px rgba(0, 0, 0, .23);
      display: none;
      box-sizing: border-box;
    }

    .filter-panel.open {
      display: block;
    }

    .filter-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .filter-zoom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      margin-bottom: 12px;
      padding-bottom: 10px;
      font-size: 14px;
    }

    .filter-zoom-row b {
      font-size: 16px;
    }

    .field-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      height: 38px;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 0 9px;
      background: #fff;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      font-size: 14px;
    }

    .update-row {
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 10px;
      font-size: 12px;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    .order-marker {
      --order-color: #f27618;
      position: relative;
      width: 64px;
      height: 58px;
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      line-height: 15px;
    }

    .order-marker-panel {
      position: absolute;
      top: 0;
      left: 50%;
      min-width: 52px;
      min-height: 40px;
      padding: 5px 7px;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 11px;
      background: var(--order-color);
      color: #fff;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .22);
      box-sizing: border-box;
      transform: translateX(-50%);
    }

    .order-marker-pointer {
      position: absolute;
      left: 50%;
      top: 39px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid rgba(255, 255, 255, .95);
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .16));
      transform: translateX(-50%);
    }

    .order-marker-pointer::after {
      content: "";
      position: absolute;
      left: -4px;
      top: -8px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 6px solid var(--order-color);
    }

    .order-marker-dot {
      position: absolute;
      left: 50%;
      top: 46px;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 50%;
      background: var(--order-color);
      box-shadow: 0 1px 5px rgba(0, 0, 0, .24);
      box-sizing: border-box;
      transform: translateX(-50%);
    }

    .order-new {
      --order-color: #FF0000;
    }

    .order-inprocess {
      --order-color: #035ccf;
    }

    .order-inprocess-scheduled {
      --order-color: #7e04d5;
    }

    .order-complete {
      --order-color: #179b4c;
    }

    .order-cancel {
      --order-color: #777;
    }

    .restaurant-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #d71920;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .32);
      box-sizing: border-box;
    }

    .shipper-list {
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 9px;
    }

    .top-shipper-list .shipper-list {
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }

    .shipper-list-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .shipper-person-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      font-size: 13px;
      white-space: nowrap;
    }

    .shipper-person-row input {
      margin: 0;
    }

    .shipper-person-row .name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .shipper-focus-row {
      cursor: pointer;
      border-radius: 8px;
    }

    .shipper-focus-row:active {
      background: rgba(242, 118, 24, .12);
    }

    .shipper-person-row.following {
      background: rgba(3, 92, 207, .12);
      box-shadow: 0 0 0 1.5px rgba(3, 92, 207, .35);
      border-radius: 8px;
    }

    .shipper-eta {
      font-size: 11px;
      font-weight: 700;
      color: #d95300;
      background: #fff0e6;
      border: 1px solid #ffd8c2;
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .shipper-eta.at-shop {
      color: #179b4c;
      background: #eafaf1;
      border-color: #b7eed0;
    }

    .shipper-age {
      color: #8a8f9a;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 2px;
    }

    .setting-shipper-list {
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 10px;
    }

    .map-bottom-controls {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .map-bottom-controls button {
      width: 28px;
      height: 28px;
      border: 1px solid #cfcfcf;
      background: rgba(255, 255, 255, .97);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
      color: #222;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .map-bottom-controls .reload-button {
      width: 38px;
      height: 38px;
      font-size: 19px;
    }

    .map-bottom-controls .reload-button.loading {
      animation: spinReload .8s linear infinite;
      background: #eef6ff;
      border-color: #6aa8ff;
    }

    @keyframes spinReload {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .shipper-car-marker {
      width: 16px;
      height: 32px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shipper-car-body {
      width: 16px;
      height: 32px;
      transform-origin: center center;
      transition: transform .6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .4));
    }

    .shipper-car-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      filter: brightness(1.15) saturate(1.3);
    }

    .shipper-car-offline {
      filter: grayscale(1) opacity(0.45) drop-shadow(0 1px 3px rgba(0, 0, 0, .2));
    }

    .shipper-list-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 6px;
      flex-shrink: 0;
      line-height: 1;
    }

    .shipper-side-car-img {
      display: block;
      width: 26px;
      height: auto;
      max-height: 12px;
      object-fit: contain;
      transform: scaleX(-1);
      filter: brightness(1.12) saturate(1.25) drop-shadow(0 1px 2px rgba(0, 0, 0, .25));
    }

    .shipper-side-car-img.offline {
      filter: grayscale(1) opacity(0.45) !important;
      transform: scaleX(-1);
    }

    .shipper-icon {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 50%;
      background: #f27618;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .24);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      line-height: 1;
    }

    .popup-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .order-popup-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
      padding-right: 20px;
    }

    .order-popup-header .popup-title {
      margin-bottom: 0;
    }

    .order-popup-time {
      font-size: 12px;
      color: #555;
      font-weight: normal;
      white-space: nowrap;
    }

    .popup-line {
      margin: 2px 0;
    }

    .order-popup {
      width: 100%;
      max-width: min(390px, calc(100vw - 36px));
      max-height: min(74vh, calc(100vh - 160px));
      overflow-y: auto;
      padding-right: 4px;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    .order-popup::-webkit-scrollbar {
      width: 5px;
    }

    .order-popup::-webkit-scrollbar-track {
      background: transparent;
    }

    .order-popup::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 4px;
    }

    .order-popup::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.38);
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .24);
    }

    .leaflet-popup-content {
      margin: 14px 14px 12px 14px;
      line-height: 1.4;
    }

    .leaflet-container a.leaflet-popup-close-button {
      top: 8px;
      right: 8px;
      padding: 4px;
      color: #888;
      font-size: 18px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 50%;
      transition: background 0.15s, color 0.15s;
    }

    .leaflet-container a.leaflet-popup-close-button:hover,
    .leaflet-container a.leaflet-popup-close-button:active {
      background: #eee;
      color: #222;
    }

    .popup-section-title {
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .popup-note {
      background: #fffbe8;
      border: 1px solid #f2dc73;
      border-radius: 8px;
      padding: 7px 8px;
      line-height: 1.35;
    }

    .popup-items {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .popup-item {
      background: #f6f7f9;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      line-height: 1.35;
    }

    .popup-item-name {
      color: #1e293b;
      word-break: break-word;
    }

    .popup-item-name b {
      color: #0f172a;
      font-weight: 700;
    }

    .popup-item-note {
      color: #d95300;
      font-weight: 600;
    }

    /* Route button & Badge */
    .route-button {
      position: fixed;
      left: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 1000;
      width: 38px;
      height: 38px;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
      cursor: pointer;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform .15s, background .15s, border-color .15s;
    }

    .route-button:active {
      transform: scale(0.95);
      background: #f0f7ff;
    }

    .route-button.active {
      background: #0284c7;
      color: #fff;
      border-color: #0369a1;
      box-shadow: 0 3px 12px rgba(2, 132, 199, 0.4);
    }

    .route-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 9px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
      box-sizing: border-box;
    }

    .route-badge.hidden {
      display: none;
    }

    /* Route Panel */
    .route-panel {
      position: fixed;
      left: 14px;
      bottom: calc(60px + env(safe-area-inset-bottom));
      width: min(380px, calc(100vw - 28px));
      max-height: min(78vh, calc(100vh - 120px));
      background: rgba(255, 255, 255, .98);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .24);
      z-index: 1000;
      display: none;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    .route-panel.show {
      display: flex;
      animation: slideUpFade 0.2s ease-out;
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .route-close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.05);
      border: 0;
      color: #64748b;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .route-close-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .route-body {
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .route-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .route-label {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
    }

    .route-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-count-label {
      font-size: 11px;
      color: #0284c7;
      font-weight: 700;
    }

    .route-select {
      width: 100%;
      height: 36px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 8px;
      font-size: 13px;
      background: #fff;
      color: #1e293b;
      box-sizing: border-box;
    }

    .route-stops-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .route-empty-hint {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      padding: 14px 6px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px dashed #cbd5e1;
      line-height: 1.4;
    }

    .route-stop-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
    }

    .route-stop-num {
      width: 20px;
      height: 20px;
      background: #0284c7;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .route-stop-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .route-stop-name {
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-stop-addr {
      color: #64748b;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-stop-btns {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }

    .route-stop-btn {
      width: 22px;
      height: 22px;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #475569;
      padding: 0;
    }

    .route-stop-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .route-stop-btn.delete:hover {
      background: #fee2e2;
      color: #ef4444;
      border-color: #fca5a5;
    }

    .route-quick-add-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .route-quick-add-row.hidden {
      display: none;
    }

    .route-quick-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
    }

    .route-quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .route-chip {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      color: #0369a1;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }

    .route-chip:hover {
      background: #bae6fd;
    }

    .route-toggle-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #334155;
      cursor: pointer;
      padding: 2px 0;
    }

    .route-toggle-row input {
      margin: 0;
    }

    /* Route Summary Box */
    .route-summary-box {
      background: #fbfbfe;
      border: 1px solid #e0e7ff;
      border-radius: 12px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.06);
    }

    .route-summary-box.hidden {
      display: none;
    }

    .route-summary-main {
      display: flex;
      justify-content: space-around;
      text-align: center;
      border-bottom: 1px dashed #c7d2fe;
      padding-bottom: 7px;
    }

    .route-summary-stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .stat-label {
      font-size: 10px;
      color: #6366f1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-size: 16px;
      color: #7c3aed;
      font-weight: 800;
    }

    .route-legs-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: #3730a3;
      line-height: 1.35;
    }

    .route-leg-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 2px 0;
    }

    .route-leg-label {
      font-size: 11.5px;
      color: #3730a3;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-swap-inline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 22px;
      padding: 0 8px;
      background: #ede9fe;
      color: #6d28d9;
      border: 1px solid #c4b5fd;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .route-swap-inline-btn:hover {
      background: #7c3aed;
      color: #ffffff;
      border-color: #6d28d9;
      box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25);
    }

    .route-swap-inline-btn:active {
      transform: scale(0.95);
    }

    .route-leg-stat {
      font-size: 11px;
      color: #3730a3;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .route-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-right: 26px;
      flex-wrap: nowrap;
    }

    .route-top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .route-mini-action-btn {
      height: 27px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
      transition: background .15s, opacity .15s;
    }

    .route-mini-action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .route-mini-action-btn.primary {
      background: #ede9fe;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
    }

    .route-mini-action-btn.primary:not(:disabled):hover {
      background: #ddd6fe;
    }

    .route-mini-action-btn.secondary {
      background: #e0e7ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
    }

    .route-mini-action-btn.secondary:not(:disabled):hover {
      background: #c7d2fe;
    }

    .route-mini-action-btn.danger {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .route-mini-action-btn.danger:not(:disabled):hover {
      background: #fecaca;
    }

    /* Popup Button toggle route */
    .btn-toggle-route {
      width: 100%;
      height: 32px;
      margin-top: 8px;
      background: #f5f3ff;
      border: 1px solid #ddd6fe;
      color: #7c3aed;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .btn-toggle-route:hover {
      background: #ede9fe;
    }

    .btn-toggle-route.in-route {
      background: #fee2e2;
      border-color: #fecaca;
      color: #dc2626;
    }

    .btn-toggle-route.in-route:hover {
      background: #fecaca;
    }

    /* Numbered Waypoint Badge Icon on Map (3D High-Contrast Neon) */
    .waypoint-badge-marker {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .4), 0 0 0 1px rgba(109, 40, 217, 0.4);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .waypoint-badge-marker:hover {
      transform: scale(1.15);
    }

    /* Moving Directional Route Arrow along Polyline */
    .route-arrow-marker {
      pointer-events: none !important;
      background: transparent !important;
      border: none !important;
    }

    .route-moving-arrow-wrap {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .route-moving-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      will-change: transform;
      transform-origin: center center;
      transition: transform 0.08s linear;
    }

    .route-moving-arrow svg {
      display: block;
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 4px rgba(168, 85, 247, 0.9));
    }

    /* Flowing Navigation Stream on Route Polyline */
    .route-flowing-line {
      stroke-dasharray: 8, 14;
      animation: routeStream 1.2s linear infinite;
      pointer-events: none !important;
    }

    @keyframes routeStream {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -22;
      }
    }

    @media (min-width: 769px) {
      .top-panel {
        right: 20px;
        top: 20px;
      }

      .filter-button {
        right: 20px;
        bottom: 20px;
      }

      .filter-panel {
        right: 20px;
        bottom: 72px;
      }

      .route-button {
        left: 20px;
        bottom: 20px;
      }

      .route-panel {
        left: 20px;
        bottom: 72px;
      }

      .map-bottom-controls {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>
  <div id="authOverlay" class="auth-overlay hidden">
    <form id="authForm" class="auth-card">
      <div class="auth-title">Thai Asia Map</div>
      <input id="authPassword" class="auth-input" type="password" placeholder="Mật khẩu"
        autocomplete="current-password" />
      <button class="auth-button" type="submit">Vào app</button>
      <div id="authError" class="auth-error">Sai mật khẩu</div>
    </form>
  </div>

  <div id="map"></div>

  <div class="top-panel">
    <div id="orderSummary" class="summary-pill order-summary no-orders"><b id="orderCount">0</b> đơn</div>

    <div class="top-shipper-list">
      <div class="shipper-list">
        <div id="shipperStatusList">
          <div style="font-size:12px;color:#999;padding:5px 0;">Đang tải...</div>
        </div>
      </div>
    </div>
  </div>

  <button id="routeButton" class="route-button" type="button" title="Lộ trình giao hàng chuỗi" aria-label="Lộ trình">
    <span>🛣️</span>
    <span id="routeBadge" class="route-badge hidden">0</span>
  </button>

  <div id="routePanel" class="route-panel">
    <button id="routeCloseButton" class="route-close-btn" type="button" title="Đóng">✕</button>

    <div class="route-body">
      <div class="route-top-row">
        <label class="route-toggle-row">
          <input id="routeReturnToShop" type="checkbox" />
          <span>Quay về Quán</span>
        </label>

        <div class="route-top-actions">
          <button id="routeReverseBtn" class="route-mini-action-btn secondary" type="button" title="Đảo ngược thứ tự giao đơn" disabled>⇄ Đảo</button>
          <button id="routeFitViewBtn" class="route-mini-action-btn primary" type="button" title="Xem toàn cảnh lộ trình" disabled>🔍 Toàn cảnh</button>
          <button id="routeClearBtn" class="route-mini-action-btn danger" type="button" title="Xóa toàn bộ lộ trình" disabled>🗑️ Xóa</button>
        </div>
      </div>

      <div id="routeSummaryBox" class="route-summary-box hidden">
        <div class="route-summary-main">
          <div class="route-summary-stat">
            <span class="stat-label">Tổng quãng đường</span>
            <b id="routeTotalDist" class="stat-val">—</b>
          </div>
          <div class="route-summary-stat">
            <span class="stat-label">Tổng thời gian</span>
            <b id="routeTotalTime" class="stat-val">—</b>
          </div>
        </div>
        <div id="routeLegsList" class="route-legs-list"></div>
      </div>
    </div>
  </div>

  <div class="map-bottom-controls" aria-label="Điều khiển bản đồ">
    <button id="reloadButton" class="reload-button" type="button" title="Tải lại trang">↻</button>
  </div>

  <button id="filterButton" class="filter-button" type="button" title="Bộ lọc" aria-label="Bộ lọc">⚙</button>

  <div id="filterPanel" class="filter-panel">
    <div class="filter-title">Setting</div>

    <div class="filter-zoom-row">
      <span>Zoom</span>
      <b id="currentZoom">0</b>
    </div>

    <div class="field-label">Trạng thái đơn</div>
    <select id="statusFilter">
      <option value="all">Tất cả</option>
      <option value="inprocess" selected>Tiếp nhận &amp; Mới</option>
      <option value="new">Chỉ đơn mới</option>
      <option value="complete">Hoàn thành</option>
      <option value="cancel">Hủy</option>
    </select>

    <label class="toggle-row">
      <span>Hiện đơn hàng</span>
      <input id="showOrders" type="checkbox" checked />
    </label>

    <label class="toggle-row">
      <span>Hiện shipper</span>
      <input id="showShippers" type="checkbox" checked />
    </label>

    <label class="toggle-row">
      <span>Hiện giao thông</span>
      <input id="showTraffic" type="checkbox" checked />
    </label>

    <div class="setting-shipper-list">
      <div class="shipper-list-title">Tất cả shipper</div>
      <div id="shipperSettingList">
        <div style="font-size:12px;color:#999;padding:5px 0;">Đang tải...</div>
      </div>
    </div>

    <div class="update-row">
      <span>Cập nhật dữ liệu</span>
      <span id="lastUpdate">—</span>
    </div>

    <div class="update-row" style="margin-top: 6px; border-top: 1px dashed #eee; padding-top: 8px;">
      <span>Phiên bản</span>
      <span style="font-weight: 700; color: #7c3aed;">v47</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    const API_BASE = "https://api.thaiasiasushibar.de/api";
    // Đổi mật khẩu tại đây. Sau khi đổi và push/deploy, thiết bị cũ sẽ phải nhập lại.
    let APP_PASSWORD = "12345";
    const AUTH_STORAGE_KEY = "thaiasia.map.authToken";

    // 20 giây/lần. Khi tab/app chạy nền sẽ tự dừng.
    const REFRESH_MS = 20000;

    // Thai Asia SushiBar, Leipziger Chaussee 147, Halle (Saale)
    const RESTAURANT = {
      name: "Thai Asia SushiBar",
      lat: 51.4547,
      lng: 12.01689
    };

    const DEFAULT_ZOOM_WEB = 12;
    const DEFAULT_ZOOM_ANDROID = 12;
    const DEFAULT_ZOOM_IPHONE = 11;
    const SHIPPER_FOCUS_ZOOM = 15;
    const ORDER_FOCUS_ZOOM = 15;

    function getDefaultZoom() {
      const platform = navigator.userAgent || navigator.platform || "";

      if (/iPhone|iPad|iPod/i.test(platform)) {
        return DEFAULT_ZOOM_IPHONE;
      }

      if (/Android/i.test(platform)) {
        return DEFAULT_ZOOM_ANDROID;
      }

      return DEFAULT_ZOOM_WEB;
    }

    // Mỗi lần mở trang, map luôn bắt đầu tại quán.
    // Dữ liệu đơn/shipper tải xong sẽ KHÔNG tự kéo map sang chỗ khác.
    const map = L.map("map", {
      zoomControl: false
    }).setView([RESTAURANT.lat, RESTAURANT.lng], getDefaultZoom());

    function setExactMapDimensions() {
      const mapEl = document.getElementById("map");
      const w = window.innerWidth || document.documentElement.clientWidth || screen.width;
      const h = window.innerHeight || document.documentElement.clientHeight || screen.height;
      if (mapEl && w && h) {
        mapEl.style.width = w + "px";
        mapEl.style.height = h + "px";
      }
      if (map) {
        map.invalidateSize({ debounceMoveend: true });
      }
    }

    window.addEventListener("resize", setExactMapDimensions);
    window.addEventListener("orientationchange", () => {
      setTimeout(setExactMapDimensions, 60);
      setTimeout(setExactMapDimensions, 200);
      setTimeout(setExactMapDimensions, 500);
      setTimeout(setExactMapDimensions, 900);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", setExactMapDimensions);
    }
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        setTimeout(setExactMapDimensions, 50);
      }
    });

    if (typeof ResizeObserver !== "undefined") {
      try {
        const ro = new ResizeObserver(() => {
          setExactMapDimensions();
        });
        ro.observe(document.documentElement);
        ro.observe(document.body);
      } catch (e) {}
    }

    setTimeout(setExactMapDimensions, 50);
    setTimeout(setExactMapDimensions, 250);
    setTimeout(setExactMapDimensions, 600);

    function resetMapToRestaurant() {
      stopFollowShipper();
      map.setView([RESTAURANT.lat, RESTAURANT.lng], getDefaultZoom());
    }

    function getGoogleMapTileUrl(withTraffic) {
      const lyr = withTraffic ? "m,traffic" : "m";
      const scale = (typeof window !== "undefined" && window.devicePixelRatio && window.devicePixelRatio >= 1.5) ? 2 : 1;
      return `https://{s}.google.com/vt/lyrs=${lyr}&x={x}&y={y}&z={z}&scale=${scale}`;
    }

    const isTrafficEnabled = localStorage.getItem("thaiasia.showTraffic") !== "0";

    const baseTileLayer = L.tileLayer(getGoogleMapTileUrl(isTrafficEnabled), {
      maxZoom: 20,
      subdomains: ["mt0", "mt1", "mt2", "mt3"],
      tileSize: 256,
      updateWhenZooming: true,
      updateWhenIdle: false
    }).addTo(map);

    const orderLayer = L.layerGroup().addTo(map);
    const shipperLayer = L.layerGroup().addTo(map);
    const routeLayerGroup = L.layerGroup().addTo(map);

    const ROUTE_RETURN_TO_SHOP_KEY = "thaiasia.routeReturnToShop";
    let routeOrderKeys = [];
    let isRoutingArmed = false;
    let lastInteractedOrderKey = null;
    let routeStartType = null;
    let routeReturnToShop = localStorage.getItem(ROUTE_RETURN_TO_SHOP_KEY) !== "0";
    let routePolylineOutline = null;
    let routePolylineInner = null;
    let routeAnimationId = null;
    let movingArrowMarkers = [];

    let openedOrderKey = null;
    let isRefreshingOrders = false;
    let lastOrders = [];
    let lastShippers = [];

    const restaurantIcon = L.divIcon({
      className: "",
      html: '<div class="restaurant-icon">🏪</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

    const restaurantMarker = L.marker([RESTAURANT.lat, RESTAURANT.lng], {
      icon: restaurantIcon,
      zIndexOffset: 0
    })
      .bindPopup("<b>Thai Asia SushiBar</b><br>Leipziger Chaussee 147")
      .addTo(map);

    restaurantMarker.on("click", () => {
      routeStartType = "restaurant";
      isRoutingArmed = true;
      lastInteractedOrderKey = null;
      if (routeOrderKeys.length > 0) {
        calculateAndDrawRoute();
        toggleRoutePanel(true);
      }
    });

    let refreshTimer = null;
    let refreshing = false;

    const STATUS_FILTER_KEY = "thaiasia.statusFilter";
    const SHOW_ORDERS_KEY = "thaiasia.showOrders";
    const SHOW_SHIPPERS_KEY = "thaiasia.showShippers";
    const SHIPPER_VISIBILITY_KEY = "thaiasia.shipperVisibility";

    // Lưu trạng thái bật/tắt từng shipper.
    const shipperVisibility = loadShipperVisibility();
    let appUnlocked = false;

    const els = {
      authOverlay: document.getElementById("authOverlay"),
      authForm: document.getElementById("authForm"),
      authPassword: document.getElementById("authPassword"),
      authError: document.getElementById("authError"),
      filterButton: document.getElementById("filterButton"),
      filterPanel: document.getElementById("filterPanel"),
      routeButton: document.getElementById("routeButton"),
      routeBadge: document.getElementById("routeBadge"),
      routePanel: document.getElementById("routePanel"),
      routeCloseButton: document.getElementById("routeCloseButton"),
      routeReturnToShop: document.getElementById("routeReturnToShop"),
      routeSummaryBox: document.getElementById("routeSummaryBox"),
      routeTotalDist: document.getElementById("routeTotalDist"),
      routeTotalTime: document.getElementById("routeTotalTime"),
      routeLegsList: document.getElementById("routeLegsList"),
      routeFitViewBtn: document.getElementById("routeFitViewBtn"),
      routeReverseBtn: document.getElementById("routeReverseBtn"),
      routeClearBtn: document.getElementById("routeClearBtn"),
      statusFilter: document.getElementById("statusFilter"),
      showOrders: document.getElementById("showOrders"),
      showShippers: document.getElementById("showShippers"),
      showTraffic: document.getElementById("showTraffic"),
      reloadButton: document.getElementById("reloadButton"),
      orderSummary: document.getElementById("orderSummary"),
      orderCount: document.getElementById("orderCount"),
      currentZoom: document.getElementById("currentZoom"),
      shipperStatusList: document.getElementById("shipperStatusList"),
      shipperSettingList: document.getElementById("shipperSettingList"),
      lastUpdate: document.getElementById("lastUpdate")
    };

    // Khôi phục bộ lọc trạng thái và hiển thị đã lưu
    const savedStatusFilter = localStorage.getItem(STATUS_FILTER_KEY);
    if (savedStatusFilter && els.statusFilter.querySelector(`option[value="${savedStatusFilter}"]`)) {
      els.statusFilter.value = savedStatusFilter;
    } else {
      els.statusFilter.value = "inprocess";
    }

    if (localStorage.getItem(SHOW_ORDERS_KEY) !== null) {
      els.showOrders.checked = localStorage.getItem(SHOW_ORDERS_KEY) !== "0";
      if (!els.showOrders.checked && map.hasLayer(orderLayer)) {
        map.removeLayer(orderLayer);
      }
    }

    if (localStorage.getItem(SHOW_SHIPPERS_KEY) !== null) {
      els.showShippers.checked = localStorage.getItem(SHOW_SHIPPERS_KEY) !== "0";
      if (!els.showShippers.checked && map.hasLayer(shipperLayer)) {
        map.removeLayer(shipperLayer);
      }
    }

    function updateZoomDisplay() {
      els.currentZoom.textContent = String(map.getZoom());
    }

    map.on("zoomend", updateZoomDisplay);
    updateZoomDisplay();

    function hashString(value) {
      let hash = 2166136261;
      const text = String(value);
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16);
    }

    function getAuthToken() {
      return hashString(`thaiasia:${APP_PASSWORD}`);
    }

    function hasSavedAccess() {
      try {
        return localStorage.getItem(AUTH_STORAGE_KEY) === getAuthToken();
      } catch (err) {
        return false;
      }
    }

    function lockApp(reasonMessage) {
      appUnlocked = false;
      stopPolling();
      orderLayer.clearLayers();
      shipperLayer.clearLayers();
      if (typeof clearRoute === "function") clearRoute();
      els.authOverlay.classList.remove("hidden");
      if (reasonMessage) {
        els.authError.textContent = reasonMessage;
        els.authError.classList.add("show");
      } else {
        els.authError.classList.remove("show");
      }
      els.authPassword.value = "";
      setTimeout(() => els.authPassword.focus(), 0);
    }

    function unlockApp() {
      appUnlocked = true;
      els.authOverlay.classList.add("hidden");
      els.authError.classList.remove("show");
      els.authPassword.value = "";
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }
      setTimeout(() => {
        setExactMapDimensions();
        startPolling();
      }, 60);

    async function syncLatestPassword() {
      try {
        const res = await fetch(`index.html?_t=${Date.now()}`, {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache" }
        });
        if (!res.ok) return true;
        const text = await res.text();
        const match = text.match(/(?:const|let)\s+APP_PASSWORD\s*=\s*["']([^"']+)["']/);
        if (match && match[1]) {
          const serverPassword = match[1];
          if (serverPassword !== APP_PASSWORD) {
            APP_PASSWORD = serverPassword;
            if (!hasSavedAccess()) {
              lockApp("Mật khẩu đã được thay đổi. Vui lòng nhập mật khẩu mới.");
              return false;
            }
          }
        }
      } catch (err) {
        // Bỏ qua lỗi kết nối khi offline
      }
      return true;
    }

    async function handleAppResume() {
      if (document.hidden || isResuming) return;
      isResuming = true;

      try {
        if ("serviceWorker" in navigator) {
          try {
            const reg = await navigator.serviceWorker.getRegistration();
            if (reg) await reg.update();
          } catch (e) {}
        }

        if (!hasSavedAccess()) {
          lockApp();
          return;
        }

        const isStillValid = await syncLatestPassword();
        if (!isStillValid || !hasSavedAccess()) {
          return;
        }

        if (!appUnlocked) {
          unlockApp();
        } else {
          startPolling();
        }
      } finally {
        isResuming = false;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function toNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function unwrapList(payload) {
      if (Array.isArray(payload)) return payload;
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload?.data?.data)) return payload.data.data;
      return [];
    }

    function unwrapPage(payload) {
      if (Array.isArray(payload)) {
        return { items: payload, lastPage: 1 };
      }

      if (Array.isArray(payload?.data)) {
        return { items: payload.data, lastPage: 1 };
      }

      if (Array.isArray(payload?.data?.data)) {
        return {
          items: payload.data.data,
          lastPage: Math.max(1, Number(payload.data.last_page) || 1)
        };
      }

      return { items: [], lastPage: 1 };
    }

    async function fetchJson(url) {
      const freshUrl = new URL(url, window.location.href);
      freshUrl.searchParams.set("_", String(Date.now()));

      const res = await fetch(freshUrl.toString(), { cache: "no-store" });
      if (!res.ok) throw new Error(`${res.status} ${url}`);
      return res.json();
    }

    function orderStatusUrl(status, page) {
      return `${API_BASE}/dh/?page=${page}&status=${encodeURIComponent(status)}`;
    }

    async function fetchOrdersByStatus(status) {
      const firstPayload = await fetchJson(orderStatusUrl(status, 1));
      const firstPage = unwrapPage(firstPayload);

      if (firstPage.lastPage <= 1) {
        return firstPage.items;
      }

      const restPages = [];
      for (let page = 2; page <= firstPage.lastPage; page++) {
        restPages.push(page);
      }

      const restPayloads = await Promise.all(
        restPages.map(page => fetchJson(orderStatusUrl(status, page)))
      );

      return firstPage.items.concat(
        ...restPayloads.map(payload => unwrapPage(payload).items)
      );
    }

    async function loadOrders() {
      const selected = els.statusFilter.value;

      let statuses;
      if (selected === "all") {
        // "Tất cả": gộp 4 trạng thái đã xác nhận từ API.
        statuses = ["new", "inprocess", "complete", "cancel"];
      } else if (selected === "inprocess") {
        // "Tiếp nhận & Mới": hiển thị và cập nhật cả đơn Mới và đơn Tiếp nhận
        statuses = ["new", "inprocess"];
      } else {
        statuses = [selected];
      }

      const results = await Promise.all(
        statuses.map(status => fetchOrdersByStatus(status))
      );

      let orders = results.flat();

      // Tránh trùng đơn nếu backend trả cùng đơn ở nhiều trạng thái.
      const unique = new Map();
      orders.forEach(order => unique.set(order.id || order.code, order));
      orders = Array.from(unique.values());

      // Mặc định trên bản đồ luôn chỉ hiện đơn giao hàng
      orders = orders.filter(order => order.shipping_method === "home_delivery");

      renderOrders(orders);
      return orders;
    }

    function orderStatusText(status, statusTitle) {
      if (statusTitle) return statusTitle;
      if (status === "new") return "Đơn mới";
      if (status === "inprocess") return "Tiếp nhận";
      if (status === "complete") return "Hoàn thành";
      if (status === "cancel") return "Hủy";
      return status || "Không rõ";
    }

    function isScheduledInprocessOrder(order) {
      const time = String(order?.time || "").trim().toLowerCase();
      return order?.status === "inprocess" && time !== "" && !time.includes("schnell");
    }

    function orderClass(order) {
      const status = order?.status ?? "";

      if (status === "new") return "order-new";
      if (status === "complete") return "order-complete";
      if (status === "cancel") return "order-cancel";
      if (isScheduledInprocessOrder(order)) return "order-inprocess-scheduled";
      return "order-inprocess";
    }

    function formatOrderTime(createdAt) {
      if (!createdAt) return "";
      const d = new Date(createdAt);
      if (Number.isNaN(d.getTime())) return "";

      return new Intl.DateTimeFormat("vi-VN", {
        timeZone: "Europe/Berlin",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(d);
    }

    function formatOrderAddress(order) {
      if (!order) return "";
      const street = String(order.address || "").trim();
      const houseNum = String(order.apartment_number || order.house_number || "").trim();
      const postcode = String(order.postcode || "").trim();
      const city = String(order.city || "").trim();

      let streetLine = street;
      if (houseNum) {
        if (!street) {
          streetLine = houseNum;
        } else if (!street.endsWith(houseNum)) {
          streetLine = `${street} ${houseNum}`;
        }
      }

      const cityLine = [postcode, city].filter(Boolean).join(" ");
      return [streetLine, cityLine].filter(Boolean).join(", ");
    }

    function formatOrderDateTime(createdAt) {
      if (!createdAt) return "";
      const d = new Date(createdAt);
      if (Number.isNaN(d.getTime())) return "";

      return new Intl.DateTimeFormat("vi-VN", {
        timeZone: "Europe/Berlin",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(d);
    }

    function formatEuro(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "";
      return new Intl.NumberFormat("de-DE", {
        style: "currency",
        currency: "EUR"
      }).format(n);
    }

    function escapeHtmlWithBreaks(value) {
      return escapeHtml(value).replace(/\r?\n/g, "<br>");
    }

    function formatOrderItemTotal(item) {
      const quantity = Number(item?.quantity);
      const price = Number(item?.product_price);
      if (!Number.isFinite(quantity) || !Number.isFinite(price)) return "";
      return formatEuro(quantity * price);
    }

    function renderOrderItems(items) {
      if (!Array.isArray(items) || items.length === 0) return "";

      const rows = items.map(item => {
        const quantity = Number(item?.quantity) || 1;
        const rawCode = String(item?.code || "").replace(/^#+/, "").trim();
        const rawName = String(item?.product_name || item?.name || "").trim();
        const note = String(item?.note || "").trim();

        let itemLabel = "";
        if (rawCode) {
          itemLabel = `${quantity} x ${rawCode}`;
        } else {
          itemLabel = `${quantity} x ${rawName || "Món ăn"}`;
        }

        return `
          <div class="popup-item">
            <span class="popup-item-name">
              <b>${escapeHtml(itemLabel)}</b>${note ? `: <span class="popup-item-note">${escapeHtml(note)}</span>` : ""}
            </span>
          </div>
        `;
      }).join("");

      return `
        <div class="popup-section-title">Thông tin món ăn</div>
        <div class="popup-items">${rows}</div>
      `;
    }

    function focusOrderMarker(lat, lng, zoom = ORDER_FOCUS_ZOOM) {
      if (lat === null || lng === null) return;
      const targetZoom = zoom || map.getZoom();
      const containerHeight = map.getSize().y;

      // Đặt vị trí marker nằm trên nút reload khoảng 85px - 100px từ mép dưới màn hình
      const bottomPadding = Math.min(100, Math.max(75, containerHeight * 0.14));
      const offsetY = (containerHeight / 2) - bottomPadding;

      const point = map.project([lat, lng], targetZoom);
      const newCenterPoint = new L.Point(point.x, point.y - offsetY);
      const newCenterLatLng = map.unproject(newCenterPoint, targetZoom);

      map.setView(newCenterLatLng, targetZoom, { animate: true });
    }

    function getOrderKey(order) {
      return String(order?.id || order?.code || `${order?.latitude}_${order?.longitude}`);
    }

    function renderOrders(orders) {
      isRefreshingOrders = true;
      const prevOpenedKey = openedOrderKey;
      orderLayer.clearLayers();
      openedOrderKey = prevOpenedKey;
      lastOrders = Array.isArray(orders) ? orders : [];

      const points = [];
      let markerToReopen = null;

      orders.forEach(order => {
        const lat = toNumber(order.latitude);
        const lng = toNumber(order.longitude);
        if (lat === null || lng === null) return;

        const time = formatOrderTime(order.created_at);
        const code = order.code ?? "?";
        const status = order.status ?? "";
        const orderKey = getOrderKey(order);
        const isInRoute = routeOrderKeys.includes(orderKey);
        const routeBtnText = isInRoute ? "➖ Bỏ khỏi lộ trình" : "➕ Thêm vào lộ trình";

        const icon = L.divIcon({
          className: "",
          html: `
            <div class="order-marker ${orderClass(order)}">
              <div class="order-marker-panel">
                #${escapeHtml(code)}
                ${time ? `<br>${escapeHtml(time)}` : ""}
              </div>
              <div class="order-marker-pointer"></div>
              <div class="order-marker-dot"></div>
            </div>
          `,
          iconSize: [64, 58],
          iconAnchor: [32, 52]
        });

        const fullName = `${order.first_name ?? ""} ${order.last_name ?? ""}`.trim();
        const fullAddress = formatOrderAddress(order);
        const orderTime = String(order.time || "").trim();
        const note = String(order.note || "").trim();
        const noteHtml = note
          ? `
            <div class="popup-section-title">Ghi chú</div>
            <div class="popup-note">${escapeHtmlWithBreaks(note)}</div>
          `
          : "";

        const popup = `
          <div class="order-popup">
            <div class="order-popup-header">
              <span class="popup-title">Đơn #${escapeHtml(code)}</span>
              ${order.created_at ? `<span class="order-popup-time">${escapeHtml(formatOrderDateTime(order.created_at))}</span>` : ""}
            </div>
            <div class="popup-line"><b>${escapeHtml(orderStatusText(status, order.status_title))}</b></div>
            ${fullName ? `<div class="popup-line">${escapeHtml(fullName)}</div>` : ""}
            ${fullAddress ? `<div class="popup-line">${escapeHtml(fullAddress)}</div>` : ""}
            ${orderTime ? `<div class="popup-line">Thời gian: ${escapeHtml(orderTime)}</div>` : ""}
            ${noteHtml}
            ${renderOrderItems(order.items)}
            <div class="popup-line">Tổng: ${escapeHtml(formatEuro(order.total))}</div>
            <button type="button" class="btn-toggle-route ${isInRoute ? 'in-route' : ''}" data-order-key="${escapeHtml(orderKey)}" onclick="toggleOrderInRoute('${escapeHtml(orderKey)}')">
              ${routeBtnText}
            </button>
          </div>
        `;

        const marker = L.marker([lat, lng], { icon })
          .bindPopup(popup, {
            maxWidth: 400,
            minWidth: 280,
            autoPan: false
          })
          .addTo(orderLayer);

        marker.on("click", () => {
          stopFollowShipper();
          const inRoute = routeOrderKeys.includes(orderKey);

          if (inRoute) {
            // Đơn đã có trong lộ trình -> Mở chi tiết đơn
            focusOrderMarker(lat, lng, ORDER_FOCUS_ZOOM);
            marker.openPopup();
            lastInteractedOrderKey = orderKey;
            return;
          }

          if (isRoutingArmed || routeOrderKeys.length > 0) {
            // Đã chọn shipper/quán hoặc đã có đơn trong tuyến -> Nối tiếp đơn này vào tuyến
            setTimeout(() => {
              marker.closePopup();
              map.closePopup();
            }, 0);
            routeOrderKeys.push(orderKey);
            isRoutingArmed = true;
            lastInteractedOrderKey = orderKey;
            renderRoutePanelUi();
            calculateAndDrawRoute();
            toggleRoutePanel(true);
            return;
          }

          // Chưa kích hoạt nối ghép (vừa reload, chưa click shipper/quán):
          if (!lastInteractedOrderKey || lastInteractedOrderKey === orderKey) {
            // Lần click đầu tiên vào đơn -> Mở popup thông tin đơn hàng bình thường
            lastInteractedOrderKey = orderKey;
            focusOrderMarker(lat, lng, ORDER_FOCUS_ZOOM);
            marker.openPopup();
          } else {
            // Trước đó đã click vào 1 đơn khác (ví dụ: đã xem #9 rồi tắt/chuyển qua #7) -> Nối ghép #9 và #7!
            setTimeout(() => {
              marker.closePopup();
              map.closePopup();
            }, 0);
            const prevKey = lastInteractedOrderKey;
            if (!routeOrderKeys.includes(prevKey)) {
              routeOrderKeys.push(prevKey);
            }
            if (!routeOrderKeys.includes(orderKey)) {
              routeOrderKeys.push(orderKey);
            }
            isRoutingArmed = true;
            lastInteractedOrderKey = orderKey;
            renderRoutePanelUi();
            calculateAndDrawRoute();
            toggleRoutePanel(true);
          }
        });

        marker.on("popupopen", () => {
          openedOrderKey = orderKey;
        });

        marker.on("popupclose", () => {
          if (!isRefreshingOrders && openedOrderKey === orderKey) {
            openedOrderKey = null;
          }
        });

        if (openedOrderKey === orderKey) {
          markerToReopen = marker;
        }

        points.push([lat, lng]);
      });

      if (markerToReopen) {
        markerToReopen.openPopup();
      }
      isRefreshingOrders = false;

      renderRoutePanelUi();
      calculateAndDrawRoute();

      els.orderCount.textContent = String(orders.length);
      els.orderSummary.classList.toggle("has-orders", orders.length >= 1);
      els.orderSummary.classList.toggle("no-orders", orders.length === 0);
    }

    window.toggleOrderInRoute = function (orderKey) {
      if (!orderKey) return;
      const idx = routeOrderKeys.indexOf(orderKey);
      if (idx >= 0) {
        routeOrderKeys.splice(idx, 1);
        if (routeOrderKeys.length === 0) {
          isRoutingArmed = false;
          lastInteractedOrderKey = null;
        }
      } else {
        routeOrderKeys.push(orderKey);
        isRoutingArmed = true;
        lastInteractedOrderKey = orderKey;
        toggleRoutePanel(true);
      }
      renderRoutePanelUi();
      calculateAndDrawRoute();
      document.querySelectorAll(`.btn-toggle-route[data-order-key="${orderKey}"]`).forEach(btn => {
        const inRoute = routeOrderKeys.includes(orderKey);
        btn.classList.toggle("in-route", inRoute);
        btn.innerHTML = inRoute ? "➖ Bỏ khỏi lộ trình" : "➕ Thêm vào lộ trình";
      });

    window.moveRouteOrder = function (index, direction) {
      const target = index + direction;
      if (target < 0 || target >= routeOrderKeys.length) return;
      const temp = routeOrderKeys[index];
      routeOrderKeys[index] = routeOrderKeys[target];
      routeOrderKeys[target] = temp;
      renderRoutePanelUi();
      calculateAndDrawRoute();
    };

    window.removeRouteOrder = function (index) {
      if (index >= 0 && index < routeOrderKeys.length) {
        const removedKey = routeOrderKeys.splice(index, 1)[0];
        if (routeOrderKeys.length === 0) {
          isRoutingArmed = false;
          lastInteractedOrderKey = null;
        }
        renderRoutePanelUi();
        calculateAndDrawRoute();
        document.querySelectorAll(`.btn-toggle-route[data-order-key="${removedKey}"]`).forEach(btn => {
          btn.classList.remove("in-route");
          btn.innerHTML = "➕ Thêm vào lộ trình";
        });
      }
    };

    function stopRouteAnimation() {
      if (routeAnimationId) {
        cancelAnimationFrame(routeAnimationId);
        routeAnimationId = null;
      }
      movingArrowMarkers = [];
    }

    function getRoutePointAtDistance(latLngs, cumDist, totalDist, targetDist) {
      if (!totalDist || totalDist <= 0 || !latLngs || latLngs.length < 2) {
        return { lat: 0, lng: 0, bearing: 0 };
      }
      const d = ((targetDist % totalDist) + totalDist) % totalDist;

      let low = 0;
      let high = cumDist.length - 2;
      let idx = 0;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (cumDist[mid] <= d) {
          idx = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      const segLen = cumDist[idx + 1] - cumDist[idx];
      const t = segLen > 0 ? (d - cumDist[idx]) / segLen : 0;
      const p1 = latLngs[idx];
      const p2 = latLngs[idx + 1];

      const lat = p1[0] + t * (p2[0] - p1[0]);
      const lng = p1[1] + t * (p2[1] - p1[1]);
      const bearing = calculateBearing(p1[0], p1[1], p2[0], p2[1]);

      return { lat, lng, bearing };
    }

    function clearRoute() {
      stopRouteAnimation();
      routeOrderKeys = [];
      routeStartType = null;
      isRoutingArmed = false;
      lastInteractedOrderKey = null;
      routeLayerGroup.clearLayers();
      routePolylineOutline = null;
      routePolylineInner = null;
      renderRoutePanelUi();
      if (els.routeSummaryBox) els.routeSummaryBox.classList.add("hidden");
      toggleRoutePanel(false);
      document.querySelectorAll(".btn-toggle-route").forEach(btn => {
        btn.classList.remove("in-route");
        btn.innerHTML = "➕ Thêm vào lộ trình";
      });
    }

    function fitRouteView() {
      if (routePolylineOutline) {
        map.fitBounds(routePolylineOutline.getBounds(), {
          padding: [60, 60],
          maxZoom: 16
        });
      }
    }

    async function calculateAndDrawRoute() {
      if (!routeOrderKeys.length) {
        stopRouteAnimation();
        routeLayerGroup.clearLayers();
        routePolylineOutline = null;
        routePolylineInner = null;
        if (els.routeSummaryBox) els.routeSummaryBox.classList.add("hidden");
        return;
      }

      const waypoints = [];
      const waypointLabels = [];

      // 1. Start point (chỉ thêm nếu người dùng đã click chọn Shipper hoặc Quán)
      if (routeStartType && routeStartType.startsWith("shipper:")) {
        const shipperKey = routeStartType.replace("shipper:", "");
        const shipper = lastShippers.find(s => getShipperKey(s) === shipperKey);
        const sLat = toNumber(shipper?.latitude ?? shipper?.lat);
        const sLng = toNumber(shipper?.longitude ?? shipper?.lng ?? shipper?.lon);
        if (sLat !== null && sLng !== null) {
          waypoints.push([sLng, sLat]);
          waypointLabels.push(shipper?.user?.name || shipper?.name || "Shipper");
        }
      } else if (routeStartType === "restaurant") {
        waypoints.push([RESTAURANT.lng, RESTAURANT.lat]);
        waypointLabels.push("Tại quán");
      }

      // 2. Ordered delivery stops
      routeOrderKeys.forEach((key, i) => {
        const order = lastOrders.find(o => getOrderKey(o) === key);
        if (order) {
          const oLat = toNumber(order.latitude);
          const oLng = toNumber(order.longitude);
          if (oLat !== null && oLng !== null) {
            waypoints.push([oLng, oLat]);
            waypointLabels.push(`Đơn #${order.code ?? (i + 1)}`);
          }
        }
      });

      // 3. Return to restaurant
      if (routeReturnToShop && waypoints.length >= 2) {
        waypoints.push([RESTAURANT.lng, RESTAURANT.lat]);
        waypointLabels.push("Về Quán");
      }

      if (waypoints.length < 2) {
        stopRouteAnimation();
        routeLayerGroup.clearLayers();
        routePolylineOutline = null;
        routePolylineInner = null;
        if (els.routeSummaryBox) els.routeSummaryBox.classList.add("hidden");
        return;
      }

      try {
        const coordsStr = waypoints.map(pt => `${pt[0]},${pt[1]}`).join(";");
        const url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`;

        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (!data || data.code !== "Ok" || !Array.isArray(data.routes) || !data.routes.length) {
          throw new Error("Không tìm thấy lộ trình");
        }

        stopRouteAnimation();
        const route = data.routes[0];
        routeLayerGroup.clearLayers();

        const latLngs = route.geometry.coordinates.map(c => [c[1], c[0]]);

        routePolylineOutline = L.polyline(latLngs, {
          color: "#ffffff",
          weight: 9,
          opacity: 0.95,
          lineJoin: "round",
          lineCap: "round"
        }).addTo(routeLayerGroup);

        routePolylineInner = L.polyline(latLngs, {
          color: "#7c3aed",
          weight: 5.5,
          opacity: 0.98,
          lineJoin: "round",
          lineCap: "round"
        }).addTo(routeLayerGroup);

        // Animated Flowing Navigation Stream along Route
        L.polyline(latLngs, {
          color: "#ffffff",
          weight: 2.2,
          opacity: 0.85,
          className: "route-flowing-line",
          lineJoin: "round",
          lineCap: "round",
          interactive: false
        }).addTo(routeLayerGroup);

        // Precompute cumulative distances along route polyline
        const cumDist = [0];
        for (let i = 0; i < latLngs.length - 1; i++) {
          const d = calculateDistanceMeters(latLngs[i][0], latLngs[i][1], latLngs[i + 1][0], latLngs[i + 1][1]);
          cumDist.push(cumDist[i] + d);
        }
        const totalRouteDist = cumDist[cumDist.length - 1];

        // Animate moving directional arrows along polyline
        if (totalRouteDist >= 50 && latLngs.length >= 2) {
          const ARROW_SPACING = Math.max(200, Math.min(380, totalRouteDist / 8));
          const numArrows = Math.max(2, Math.min(18, Math.round(totalRouteDist / ARROW_SPACING)));
          const stepDist = totalRouteDist / numArrows;

          for (let k = 0; k < numArrows; k++) {
            const initialDist = (k * stepDist) % totalRouteDist;
            const pt = getRoutePointAtDistance(latLngs, cumDist, totalRouteDist, initialDist);

            const wrapEl = document.createElement("div");
            wrapEl.className = "route-moving-arrow-wrap";
            wrapEl.innerHTML = `
              <div class="route-moving-arrow" style="transform: rotate(${Math.round(pt.bearing)}deg);">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="#ffffff">
                  <path d="M12 2L22 22L12 17L2 22L12 2Z"/>
                </svg>
              </div>
            `;

            const arrowMarker = L.marker([pt.lat, pt.lng], {
              icon: L.divIcon({
                className: "route-arrow-marker",
                html: wrapEl,
                iconSize: [14, 14],
                iconAnchor: [7, 7]
              }),
              zIndexOffset: 2600,
              interactive: false
            }).addTo(routeLayerGroup);

            movingArrowMarkers.push({
              marker: arrowMarker,
              arrowEl: wrapEl.querySelector(".route-moving-arrow"),
              currentDist: initialDist,
              lastBearing: pt.bearing
            });
          }

          // Start continuous animation loop
          const SPEED_MPS = 42; // speed: ~42 m/s (smooth flowing visual speed)
          let lastTimestamp = performance.now();

          const animateRoute = (timestamp) => {
            const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
            lastTimestamp = timestamp;

            const moveDelta = SPEED_MPS * dt;
            for (let i = 0; i < movingArrowMarkers.length; i++) {
              const item = movingArrowMarkers[i];
              item.currentDist = (item.currentDist + moveDelta) % totalRouteDist;
              const pt = getRoutePointAtDistance(latLngs, cumDist, totalRouteDist, item.currentDist);

              item.marker.setLatLng([pt.lat, pt.lng]);
              if (Math.abs(pt.bearing - item.lastBearing) > 1.2) {
                item.arrowEl.style.transform = `rotate(${Math.round(pt.bearing)}deg)`;
                item.lastBearing = pt.bearing;
              }
            }

            routeAnimationId = requestAnimationFrame(animateRoute);
          };

          routeAnimationId = requestAnimationFrame(animateRoute);
        }

        // Add 3D High-Contrast Neon numbered waypoint badges on map (Phương án 5)
        routeOrderKeys.forEach((key, idx) => {
          const order = lastOrders.find(o => getOrderKey(o) === key);
          if (order) {
            const lat = toNumber(order.latitude);
            const lng = toNumber(order.longitude);
            if (lat !== null && lng !== null) {
              const badgeIcon = L.divIcon({
                className: "",
                html: `<div class="waypoint-badge-marker">${idx + 1}</div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 17]
              });
              const badgeMarker = L.marker([lat, lng], {
                icon: badgeIcon,
                zIndexOffset: 3000
              }).addTo(routeLayerGroup);

              badgeMarker.on("click", () => {
                const ordMarker = orderLayer.getLayers().find(m => {
                  const pos = m.getLatLng();
                  return Math.abs(pos.lat - lat) < 0.00001 && Math.abs(pos.lng - lng) < 0.00001;
                });
                if (ordMarker) {
                  ordMarker.openPopup();
                }
              });
            }
          }
        });

        const totalDistKm = (route.distance / 1000).toFixed(1);
        const totalMins = Math.round(route.duration / 60);
        const totalTimeStr = totalMins < 60 ? `~${totalMins} phút` : `~${Math.floor(totalMins / 60)}g${totalMins % 60}p`;

        if (els.routeTotalDist) els.routeTotalDist.textContent = `${totalDistKm} km`;
        if (els.routeTotalTime) els.routeTotalTime.textContent = totalTimeStr;

        if (els.routeLegsList && Array.isArray(route.legs)) {
          els.routeLegsList.innerHTML = "";
          route.legs.forEach((leg, idx) => {
            const fromLabel = waypointLabels[idx] || `Điểm ${idx + 1}`;
            const toLabel = waypointLabels[idx + 1] || `Điểm ${idx + 2}`;
            const legDist = leg.distance < 1000 ? `${Math.round(leg.distance)}m` : `${(leg.distance / 1000).toFixed(1)}km`;
            const legMins = Math.max(1, Math.round(leg.duration / 60));

            const isSingleOrderLeg = route.legs.length === 1 && routeOrderKeys.length >= 2;
            const isOrderToOrderLeg = fromLabel.startsWith("Đơn #") && toLabel.startsWith("Đơn #");
            const showSwapBtn = isSingleOrderLeg || isOrderToOrderLeg || (idx === 0 && routeOrderKeys.length >= 2 && route.legs.length <= 2);

            const row = document.createElement("div");
            row.className = "route-leg-row";
            row.innerHTML = `
              <span class="route-leg-label">${escapeHtml(fromLabel)} ➔ ${escapeHtml(toLabel)}</span>
              ${showSwapBtn ? `
                <button type="button" class="route-swap-inline-btn" onclick="reverseRouteOrders()" title="Đảo ngược thứ tự giao (${escapeHtml(toLabel)} ➔ ${escapeHtml(fromLabel)})">
                  ⇄ Đảo chiều
                </button>
              ` : `<span></span>`}
              <b class="route-leg-stat">${legDist} (~${legMins}p)</b>
            `;
            els.routeLegsList.appendChild(row);
          });
        }

        if (els.routeSummaryBox) els.routeSummaryBox.classList.remove("hidden");
      } catch (err) {
        console.warn("Lỗi tính lộ trình:", err);
      }
    }

    function getShipperKey(shipper) {
      return String(
        shipper?.user?.id ||
        shipper?.user_id ||
        shipper?.id ||
        shipper?.user?.name ||
        shipper?.name ||
        "unknown"
      );
    }

    function loadShipperVisibility() {
      try {
        const saved = JSON.parse(localStorage.getItem(SHIPPER_VISIBILITY_KEY) || "{}");
        return new Map(Object.entries(saved));
      } catch (err) {
        console.warn("Không đọc được cấu hình shipper:", err);
        return new Map();
      }
    }

    function saveShipperVisibility() {
      try {
        localStorage.setItem(
          SHIPPER_VISIBILITY_KEY,
          JSON.stringify(Object.fromEntries(shipperVisibility))
        );
      } catch (err) {
        console.warn("Không lưu được cấu hình shipper:", err);
      }
    }

    function getShipperSeenAt(shipper) {
      return shipper?.last_seen_at || shipper?.updated_at || shipper?.created_at || "";
    }

    function formatRelativeTime(value) {
      if (!value) return "";

      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "";

      const seconds = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
      if (seconds < 60) return `${seconds}s`;

      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}p`;

      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}g`;

      return `${Math.floor(hours / 24)}n`;
    }

    function isShipperVisible(shipper) {
      const key = getShipperKey(shipper);
      if (!shipperVisibility.has(key)) {
        shipperVisibility.set(key, true);
      }
      return shipperVisibility.get(key) !== false;
    }

    const shipperMarkers = new Map();
    let activeFollowShipperKey = null;

    function stopFollowShipper() {
      if (activeFollowShipperKey) {
        activeFollowShipperKey = null;
        updateFollowUi();

    map.on("dragstart", stopFollowShipper);

    function updateFollowUi() {
      if (!els.shipperStatusList) return;
      const rows = els.shipperStatusList.querySelectorAll(".shipper-person-row");
      rows.forEach(row => {
        const key = row.dataset.shipperKey;

    function focusShipper(shipper) {
      const key = getShipperKey(shipper);
      const marker = shipperMarkers.get(key);

      // Đặt shipper này làm điểm xuất phát cho lộ trình
      routeStartType = `shipper:${key}`;
      isRoutingArmed = true;
      lastInteractedOrderKey = null;
      if (routeOrderKeys.length > 0) {
        calculateAndDrawRoute();
        toggleRoutePanel(true);
      }

      // Nếu bấm lại vào chính shipper đang bám đuôi -> hủy bám đuôi
      if (activeFollowShipperKey === key) {
        activeFollowShipperKey = null;
        updateFollowUi();
        return;
      }

      // Kích hoạt chế độ bám đuôi theo xe này
      activeFollowShipperKey = key;

      let targetLat = toNumber(shipper.latitude ?? shipper.lat);
      let targetLng = toNumber(shipper.longitude ?? shipper.lng ?? shipper.lon);

      if (marker) {
        const markerPos = marker.getLatLng();
        targetLat = markerPos.lat;
        targetLng = markerPos.lng;
      }

      if (targetLat === null || targetLng === null) return;

      map.setView([targetLat, targetLng], SHIPPER_FOCUS_ZOOM, {
        animate: true
      });

      if (marker) {
        marker.openPopup();
      }

      updateFollowUi();
    }

    function renderShipperFilter(shippers) {

      if (!shippers.length) {

          ? '<img src="shipper-car-side.png" alt="car" class="shipper-side-car-img" />'

        label.appendChild(icon);
        label.appendChild(nameEl);

          etaEl.textContent = eta.atRestaurant ? "Tại quán" : `${eta.etaText} (${eta.distText})`;
          label.appendChild(etaEl);
        }
