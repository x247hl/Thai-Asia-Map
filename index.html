<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thai Asia Map" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f6f7fb;
      box-sizing: border-box;
    }

    .auth-overlay.hidden {
      display: none;
    }

    .auth-card {
      width: min(340px, 100%);
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, .18);
      box-sizing: border-box;
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .auth-input {
      width: 100%;
      height: 42px;
      border: 1px solid #d6d9df;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .auth-button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #f27618;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-error {
      display: none;
      color: #c62828;
      font-size: 13px;
      margin-top: 10px;
    }

    .auth-error.show {
      display: block;
    }

    .top-panel {
      position: fixed;
      right: 10px;
      top: calc(10px + env(safe-area-inset-top));
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
      max-width: calc(100vw - 20px);
      pointer-events: none;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .summary-pill {
      background: rgba(255, 255, 255, .96);
      padding: 8px 10px;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .18);
      font-size: 12px;
      white-space: nowrap;
    }

    .summary-pill b {
      font-size: 14px;
      margin-right: 3px;
    }

    .order-summary {
      color: #111;
      transition: background-color .15s ease, color .15s ease;
    }

    .order-summary.has-orders {
      background: #FF2400;
      color: #fff;
    }

    .order-summary.no-orders {
      background: #00FF00;
      color: #111;
    }

    .top-shipper-list {
      width: max-content;
      min-width: 0;
      max-width: calc(100vw - 20px);
      max-height: min(42vh, 260px);
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(255, 255, 255, .96);
      border-radius: 12px;
      padding: 8px 10px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .18);
      box-sizing: border-box;
      pointer-events: auto;
    }

    .filter-button {
      position: fixed;
      right: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 1100;
      border: 0;
      background: #fff;
      border-radius: 999px;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .22);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .filter-panel {
      position: fixed;
      right: 12px;
      bottom: calc(64px + env(safe-area-inset-bottom));
      z-index: 1100;
      width: min(285px, calc(100vw - 24px));
      background: rgba(255, 255, 255, .98);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 5px 22px rgba(0, 0, 0, .23);
      display: none;
      box-sizing: border-box;
    }

    .filter-panel.open {
      display: block;
    }

    .filter-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .filter-zoom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      margin-bottom: 12px;
      padding-bottom: 10px;
      font-size: 14px;
    }

    .filter-zoom-row b {
      font-size: 16px;
    }

    .field-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      height: 38px;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 0 9px;
      background: #fff;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      font-size: 14px;
    }

    .update-row {
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 10px;
      font-size: 12px;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    .order-marker {
      --order-color: #f27618;
      position: relative;
      width: 64px;
      height: 58px;
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      line-height: 15px;
    }

    .order-marker-panel {
      position: absolute;
      top: 0;
      left: 50%;
      min-width: 52px;
      min-height: 40px;
      padding: 5px 7px;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 11px;
      background: var(--order-color);
      color: #fff;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .22);
      box-sizing: border-box;
      transform: translateX(-50%);
    }

    .order-marker-pointer {
      position: absolute;
      left: 50%;
      top: 39px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid rgba(255, 255, 255, .95);
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .16));
      transform: translateX(-50%);
    }

    .order-marker-pointer::after {
      content: "";
      position: absolute;
      left: -4px;
      top: -8px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 6px solid var(--order-color);
    }

    .order-marker-dot {
      position: absolute;
      left: 50%;
      top: 46px;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 50%;
      background: var(--order-color);
      box-shadow: 0 1px 5px rgba(0, 0, 0, .24);
      box-sizing: border-box;
      transform: translateX(-50%);
    }

    .order-new {
      --order-color: #FF0000;
    }

    .order-inprocess {
      --order-color: #2f80ed;
    }

    .order-inprocess-scheduled {
      --order-color: #6a0dad;
    }

    .order-complete {
      --order-color: #179b4c;
    }

    .order-cancel {
      --order-color: #777;
    }

    .restaurant-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #d71920;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .32);
      box-sizing: border-box;
    }

    .shipper-list {
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 9px;
    }

    .top-shipper-list .shipper-list {
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }

    .shipper-list-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .shipper-person-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 14px;
      white-space: nowrap;
    }

    .shipper-person-row input {
      margin: 0;
    }

    .shipper-person-row .name {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: calc(100vw - 86px);
    }

    .shipper-focus-row {
      cursor: pointer;
      border-radius: 8px;
    }

    .shipper-focus-row:active {
      background: rgba(242, 118, 24, .12);
    }

    .shipper-age {
      margin-left: auto;
      color: #8a8f9a;
      font-size: 12px;
      white-space: nowrap;
    }

    .setting-shipper-list {
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 10px;
    }

    .map-bottom-controls {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .map-bottom-controls button {
      width: 28px;
      height: 28px;
      border: 1px solid #cfcfcf;
      background: rgba(255, 255, 255, .97);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
      color: #222;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .map-bottom-controls .reload-button {
      width: 38px;
      height: 38px;
      font-size: 19px;
    }

    .map-bottom-controls .reload-button.loading {
      animation: spinReload .8s linear infinite;
      background: #eef6ff;
      border-color: #6aa8ff;
    }

    @keyframes spinReload {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .shipper-car-marker {
      width: 32px;
      height: 52px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shipper-car-body {
      width: 28px;
      height: 48px;
      transform-origin: center center;
      transition: transform .6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .38));
    }

    .shipper-car-offline {
      filter: grayscale(1) opacity(0.55) drop-shadow(0 2px 4px rgba(0, 0, 0, .25));
    }

    .shipper-icon {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 50%;
      background: #f27618;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .24);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      line-height: 1;
    }

    .popup-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .popup-line {
      margin: 2px 0;
    }

    .order-popup {
      max-width: 360px;
      max-height: min(60vh, 520px);
      overflow-y: auto;
      padding-right: 4px;
      box-sizing: border-box;
    }

    .popup-section-title {
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .popup-note {
      background: #fffbe8;
      border: 1px solid #f2dc73;
      border-radius: 8px;
      padding: 7px 8px;
      line-height: 1.35;
    }

    .popup-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .popup-item {
      background: #f6f7f9;
      border-radius: 8px;
      padding: 7px 8px;
    }

    .popup-item-main {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      font-weight: 700;
    }

    .popup-item-name {
      min-width: 0;
    }

    .popup-item-price {
      white-space: nowrap;
    }

    .popup-item-meta {
      color: #475569;
      font-size: 12px;
      margin-top: 3px;
    }

    @media (min-width: 769px) {
      .top-panel {
        right: 20px;
        top: 20px;
      }

      .filter-button {
        right: 20px;
        bottom: 20px;
      }

      .filter-panel {
        right: 20px;
        bottom: 72px;
      }

      .map-bottom-controls {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>
  <div id="authOverlay" class="auth-overlay">
    <form id="authForm" class="auth-card">
      <div class="auth-title">Thai Asia Map</div>
      <input id="authPassword" class="auth-input" type="password" placeholder="Mật khẩu"
        autocomplete="current-password" />
      <button class="auth-button" type="submit">Vào app</button>
      <div id="authError" class="auth-error">Sai mật khẩu</div>
    </form>
  </div>

  <div id="map"></div>

  <div class="top-panel">
    <div class="summary">
      <div id="orderSummary" class="summary-pill order-summary no-orders"><b id="orderCount">0</b> đơn</div>
      <div class="summary-pill"><b id="shipperCount">0</b> shipper</div>
    </div>

    <div class="top-shipper-list">
      <div class="shipper-list">
        <div id="shipperStatusList">
          <div style="font-size:12px;color:#999;padding:5px 0;">Đang tải...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="map-bottom-controls" aria-label="Điều khiển bản đồ">
    <button id="reloadButton" class="reload-button" type="button" title="Tải lại trang">↻</button>
  </div>

  <button id="filterButton" class="filter-button" type="button" title="Bộ lọc" aria-label="Bộ lọc">⚙</button>

  <div id="filterPanel" class="filter-panel">
    <div class="filter-title">Setting</div>

    <div class="filter-zoom-row">
      <span>Zoom</span>
      <b id="currentZoom">0</b>
    </div>

    <div class="field-label">Trạng thái đơn</div>
    <select id="statusFilter">
      <option value="all">Tất cả</option>
      <option value="inprocess" selected>Tiếp nhận &amp; Mới</option>
      <option value="new">Chỉ đơn mới</option>
      <option value="complete">Hoàn thành</option>
      <option value="cancel">Hủy</option>
    </select>

    <label class="toggle-row">
      <span>Hiện đơn hàng</span>
      <input id="showOrders" type="checkbox" checked />
    </label>

    <label class="toggle-row">
      <span>Hiện shipper</span>
      <input id="showShippers" type="checkbox" checked />
    </label>

    <div class="setting-shipper-list">
      <div class="shipper-list-title">Tất cả shipper</div>
      <div id="shipperSettingList">
        <div style="font-size:12px;color:#999;padding:5px 0;">Đang tải...</div>
      </div>
    </div>

    <div class="update-row">
      <span>Tự cập nhật</span>
      <span id="lastUpdate">—</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    const API_BASE = "https://api.thaiasiasushibar.de/api";
    // Đổi mật khẩu tại đây. Sau khi đổi và push/deploy, thiết bị cũ sẽ phải nhập lại.
    let APP_PASSWORD = "12345";
    const AUTH_STORAGE_KEY = "thaiasia.map.authToken";

    // 20 giây/lần. Khi tab/app chạy nền sẽ tự dừng.
    const REFRESH_MS = 20000;

    // Thai Asia SushiBar, Leipziger Chaussee 147, Halle (Saale)
    const RESTAURANT = {
      name: "Thai Asia SushiBar",
      lat: 51.4547,
      lng: 12.01689
    };

    const DEFAULT_ZOOM_WEB = 12;
    const DEFAULT_ZOOM_ANDROID = 12;
    const DEFAULT_ZOOM_IPHONE = 11;
    const SHIPPER_FOCUS_ZOOM = 14;

    function getDefaultZoom() {
      const platform = navigator.userAgent || navigator.platform || "";

      if (/iPhone|iPad|iPod/i.test(platform)) {
        return DEFAULT_ZOOM_IPHONE;
      }

      if (/Android/i.test(platform)) {
        return DEFAULT_ZOOM_ANDROID;
      }

      return DEFAULT_ZOOM_WEB;
    }

    // Mỗi lần mở trang, map luôn bắt đầu tại quán.
    // Dữ liệu đơn/shipper tải xong sẽ KHÔNG tự kéo map sang chỗ khác.
    const map = L.map("map", {
      zoomControl: false
    }).setView([RESTAURANT.lat, RESTAURANT.lng], getDefaultZoom());

    function resetMapToRestaurant() {
      map.setView([RESTAURANT.lat, RESTAURANT.lng], getDefaultZoom());
    }

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const orderLayer = L.layerGroup().addTo(map);
    const shipperLayer = L.layerGroup().addTo(map);

    const restaurantIcon = L.divIcon({
      className: "",
      html: '<div class="restaurant-icon">🏪</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

    L.marker([RESTAURANT.lat, RESTAURANT.lng], {
      icon: restaurantIcon,
      zIndexOffset: 0
    })
      .bindPopup("<b>Thai Asia SushiBar</b><br>Leipziger Chaussee 147")
      .addTo(map);

    let refreshTimer = null;
    let refreshing = false;

    const SHIPPER_VISIBILITY_KEY = "thaiasia.shipperVisibility";

    // Lưu trạng thái bật/tắt từng shipper.
    const shipperVisibility = loadShipperVisibility();
    let lastShippers = [];
    let appUnlocked = false;

    const els = {
      authOverlay: document.getElementById("authOverlay"),
      authForm: document.getElementById("authForm"),
      authPassword: document.getElementById("authPassword"),
      authError: document.getElementById("authError"),
      filterButton: document.getElementById("filterButton"),
      filterPanel: document.getElementById("filterPanel"),
      statusFilter: document.getElementById("statusFilter"),
      showOrders: document.getElementById("showOrders"),
      showShippers: document.getElementById("showShippers"),
      reloadButton: document.getElementById("reloadButton"),
      orderSummary: document.getElementById("orderSummary"),
      orderCount: document.getElementById("orderCount"),
      shipperCount: document.getElementById("shipperCount"),
      currentZoom: document.getElementById("currentZoom"),
      shipperStatusList: document.getElementById("shipperStatusList"),
      shipperSettingList: document.getElementById("shipperSettingList"),
      lastUpdate: document.getElementById("lastUpdate")
    };

    function updateZoomDisplay() {
      els.currentZoom.textContent = String(map.getZoom());
    }

    map.on("zoomend", updateZoomDisplay);
    updateZoomDisplay();

    function hashString(value) {
      let hash = 2166136261;
      const text = String(value);
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16);
    }

    function getAuthToken() {
      return hashString(`thaiasia:${APP_PASSWORD}`);
    }

    function hasSavedAccess() {
      try {
        return localStorage.getItem(AUTH_STORAGE_KEY) === getAuthToken();
      } catch (err) {
        return false;
      }
    }

    function lockApp(reasonMessage) {
      appUnlocked = false;
      stopPolling();
      orderLayer.clearLayers();
      shipperLayer.clearLayers();
      els.authOverlay.classList.remove("hidden");
      if (reasonMessage) {
        els.authError.textContent = reasonMessage;
        els.authError.classList.add("show");
      } else {
        els.authError.classList.remove("show");
      }
      els.authPassword.value = "";
      setTimeout(() => els.authPassword.focus(), 0);
    }

    function unlockApp() {
      appUnlocked = true;
      els.authOverlay.classList.add("hidden");
      els.authError.classList.remove("show");
      els.authPassword.value = "";
      setTimeout(() => {
        map.invalidateSize();
        startPolling();
      }, 0);
    }

    async function syncLatestPassword() {
      try {
        const res = await fetch(`index.html?_t=${Date.now()}`, {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache" }
        });
        if (!res.ok) return true;
        const text = await res.text();
        const match = text.match(/(?:const|let)\s+APP_PASSWORD\s*=\s*["']([^"']+)["']/);
        if (match && match[1]) {
          const serverPassword = match[1];
          if (serverPassword !== APP_PASSWORD) {
            APP_PASSWORD = serverPassword;
            if (!hasSavedAccess()) {
              lockApp("Mật khẩu đã được thay đổi. Vui lòng nhập mật khẩu mới.");
              return false;
            }
          }
        }
      } catch (err) {
        // Bỏ qua lỗi kết nối khi offline
      }
      return true;
    }

    async function handleAppResume() {
      if (document.hidden) return;

      if (!hasSavedAccess()) {
        lockApp();
        return;
      }

      const isStillValid = await syncLatestPassword();
      if (!isStillValid || !hasSavedAccess()) {
        return;
      }

      if (!appUnlocked) {
        unlockApp();
      } else {
        startPolling({ resetView: true });
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function toNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function unwrapList(payload) {
      if (Array.isArray(payload)) return payload;
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload?.data?.data)) return payload.data.data;
      return [];
    }

    function unwrapPage(payload) {
      if (Array.isArray(payload)) {
        return { items: payload, lastPage: 1 };
      }

      if (Array.isArray(payload?.data)) {
        return { items: payload.data, lastPage: 1 };
      }

      if (Array.isArray(payload?.data?.data)) {
        return {
          items: payload.data.data,
          lastPage: Math.max(1, Number(payload.data.last_page) || 1)
        };
      }

      return { items: [], lastPage: 1 };
    }

    async function fetchJson(url) {
      const freshUrl = new URL(url, window.location.href);
      freshUrl.searchParams.set("_", String(Date.now()));

      const res = await fetch(freshUrl.toString(), { cache: "no-store" });
      if (!res.ok) throw new Error(`${res.status} ${url}`);
      return res.json();
    }

    function orderStatusUrl(status, page) {
      return `${API_BASE}/dh/?page=${page}&status=${encodeURIComponent(status)}`;
    }

    async function fetchOrdersByStatus(status) {
      const firstPayload = await fetchJson(orderStatusUrl(status, 1));
      const firstPage = unwrapPage(firstPayload);

      if (firstPage.lastPage <= 1) {
        return firstPage.items;
      }

      const restPages = [];
      for (let page = 2; page <= firstPage.lastPage; page++) {
        restPages.push(page);
      }

      const restPayloads = await Promise.all(
        restPages.map(page => fetchJson(orderStatusUrl(status, page)))
      );

      return firstPage.items.concat(
        ...restPayloads.map(payload => unwrapPage(payload).items)
      );
    }

    async function loadOrders() {
      const selected = els.statusFilter.value;

      let statuses;
      if (selected === "all") {
        // "Tất cả": gộp 4 trạng thái đã xác nhận từ API.
        statuses = ["new", "inprocess", "complete", "cancel"];
      } else if (selected === "inprocess") {
        // "Tiếp nhận & Mới": hiển thị và cập nhật cả đơn Mới và đơn Tiếp nhận
        statuses = ["new", "inprocess"];
      } else {
        statuses = [selected];
      }

      const results = await Promise.all(
        statuses.map(status => fetchOrdersByStatus(status))
      );

      let orders = results.flat();

      // Tránh trùng đơn nếu backend trả cùng đơn ở nhiều trạng thái.
      const unique = new Map();
      orders.forEach(order => unique.set(order.id || order.code, order));
      orders = Array.from(unique.values());

      // Mặc định trên bản đồ luôn chỉ hiện đơn giao hàng
      orders = orders.filter(order => order.shipping_method === "home_delivery");

      renderOrders(orders);
      return orders;
    }

    function orderStatusText(status, statusTitle) {
      if (statusTitle) return statusTitle;
      if (status === "new") return "Đơn mới";
      if (status === "inprocess") return "Tiếp nhận";
      if (status === "complete") return "Hoàn thành";
      if (status === "cancel") return "Hủy";
      return status || "Không rõ";
    }

    function isScheduledInprocessOrder(order) {
      const time = String(order?.time || "").trim().toLowerCase();
      return order?.status === "inprocess" && time !== "" && !time.includes("schnell");
    }

    function orderClass(order) {
      const status = order?.status ?? "";

      if (status === "new") return "order-new";
      if (status === "complete") return "order-complete";
      if (status === "cancel") return "order-cancel";
      if (isScheduledInprocessOrder(order)) return "order-inprocess-scheduled";
      return "order-inprocess";
    }

    function formatOrderTime(createdAt) {
      if (!createdAt) return "";
      const d = new Date(createdAt);
      if (Number.isNaN(d.getTime())) return "";

      return new Intl.DateTimeFormat("vi-VN", {
        timeZone: "Europe/Berlin",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(d);
    }

    function formatOrderDateTime(createdAt) {
      if (!createdAt) return "";
      const d = new Date(createdAt);
      if (Number.isNaN(d.getTime())) return "";

      return new Intl.DateTimeFormat("vi-VN", {
        timeZone: "Europe/Berlin",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(d);
    }

    function formatEuro(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "";
      return new Intl.NumberFormat("de-DE", {
        style: "currency",
        currency: "EUR"
      }).format(n);
    }

    function escapeHtmlWithBreaks(value) {
      return escapeHtml(value).replace(/\r?\n/g, "<br>");
    }

    function formatOrderItemTotal(item) {
      const quantity = Number(item?.quantity);
      const price = Number(item?.product_price);
      if (!Number.isFinite(quantity) || !Number.isFinite(price)) return "";
      return formatEuro(quantity * price);
    }

    function renderOrderItems(items) {
      if (!Array.isArray(items) || items.length === 0) return "";

      const rows = items.map(item => {
        const codeText = item?.code ? `#${item.code} ` : "";
        const name = `${codeText}${item?.product_name || "Món ăn"}`;
        const quantity = item?.quantity ?? 0;
        const unitPrice = formatEuro(item?.product_price);
        const total = formatOrderItemTotal(item);

        return `
          <div class="popup-item">
            <div class="popup-item-main">
              <span class="popup-item-name">${escapeHtml(name)}</span>
              ${total ? `<span class="popup-item-price">${escapeHtml(total)}</span>` : ""}
            </div>
            <div class="popup-item-meta">
              Số lượng: ${escapeHtml(quantity)}${unitPrice ? ` x ${escapeHtml(unitPrice)}` : ""}
            </div>
            ${item?.note ? `<div class="popup-item-meta">Ghi chú: ${escapeHtml(item.note)}</div>` : ""}
          </div>
        `;
      }).join("");

      return `
        <div class="popup-section-title">Thông tin món ăn</div>
        <div class="popup-items">${rows}</div>
      `;
    }

    function renderOrders(orders) {
      orderLayer.clearLayers();
      const points = [];

      orders.forEach(order => {
        const lat = toNumber(order.latitude);
        const lng = toNumber(order.longitude);
        if (lat === null || lng === null) return;

        const time = formatOrderTime(order.created_at);
        const code = order.code ?? "?";
        const status = order.status ?? "";

        const icon = L.divIcon({
          className: "",
          html: `
            <div class="order-marker ${orderClass(order)}">
              <div class="order-marker-panel">
                #${escapeHtml(code)}
                ${time ? `<br>${escapeHtml(time)}` : ""}
              </div>
              <div class="order-marker-pointer"></div>
              <div class="order-marker-dot"></div>
            </div>
          `,
          iconSize: [64, 58],
          iconAnchor: [32, 52]
        });

        const fullName = `${order.first_name ?? ""} ${order.last_name ?? ""}`.trim();
        const fullAddress = [
          order.address,
          order.apartment_number ? `Nr. ${order.apartment_number}` : "",
          order.postcode,
          order.city
        ].filter(Boolean).join(", ");
        const orderTime = String(order.time || "").trim();
        const note = String(order.note || "").trim();
        const noteHtml = note
          ? `
            <div class="popup-section-title">Ghi chú</div>
            <div class="popup-note">${escapeHtmlWithBreaks(note)}</div>
          `
          : "";

        const popup = `
          <div class="order-popup">
            <div class="popup-title">Đơn #${escapeHtml(code)}</div>
            <div class="popup-line"><b>${escapeHtml(orderStatusText(status, order.status_title))}</b></div>
            ${fullName ? `<div class="popup-line">${escapeHtml(fullName)}</div>` : ""}
            ${fullAddress ? `<div class="popup-line">${escapeHtml(fullAddress)}</div>` : ""}
            ${order.created_at ? `<div class="popup-line">Ngày tạo: ${escapeHtml(formatOrderDateTime(order.created_at))}</div>` : ""}
            ${orderTime ? `<div class="popup-line">Thời gian: ${escapeHtml(orderTime)}</div>` : ""}
            ${noteHtml}
            ${renderOrderItems(order.items)}
            <div class="popup-line">Tổng: ${escapeHtml(formatEuro(order.total))}</div>
          </div>
        `;

        L.marker([lat, lng], { icon })
          .bindPopup(popup, {
            maxWidth: 380,
            minWidth: 280
          })
          .addTo(orderLayer);

        points.push([lat, lng]);
      });

      els.orderCount.textContent = String(orders.length);
      els.orderSummary.classList.toggle("has-orders", orders.length >= 1);
      els.orderSummary.classList.toggle("no-orders", orders.length === 0);
    }

    function getShipperKey(shipper) {
      return String(
        shipper?.user?.id ||
        shipper?.user_id ||
        shipper?.id ||
        shipper?.user?.name ||
        shipper?.name ||
        "unknown"
      );

    function loadShipperVisibility() {

        return new Map(Object.entries(saved));

    function saveShipperVisibility() {

    function getShipperSeenAt(shipper) {
      return shipper?.last_seen_at || shipper?.updated_at || shipper?.created_at || "";
    }

    function formatRelativeTime(value) {
      if (!value) return "";

      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "";

      const seconds = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
      if (seconds < 60) return `${seconds}s`;

      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}p`;

      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}g`;

      return `${Math.floor(hours / 24)}n`;
    }

    function isShipperVisible(shipper) {

      if (!shipperVisibility.has(key)) {

    function renderShipperFilter(shippers) {

        return;
      }

      shippers.forEach(shipper => {
        const key = getShipperKey(shipper);
        const name = shipper?.user?.name || shipper?.name || "Shipper";
        const online = shipper?.is_online === true;
        const age = formatRelativeTime(getShipperSeenAt(shipper));

        if (!shipperVisibility.has(key)) {
          shipperVisibility.set(key, true);
        }

        const label = document.createElement("label");
        label.className = "shipper-person-row";

        checkbox.type = "checkbox";
        checkbox.checked = shipperVisibility.get(key) !== false;

        icon.textContent = online ? "🚗" : "⚪";

        label.appendChild(nameEl);
        label.appendChild(ageEl);

    const shipperPrevPositions = new Map();

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = deg => (deg * Math.PI) / 180;
      const toDeg = rad => (rad * 180) / Math.PI;

      const φ1 = toRad(lat1);
      const φ2 = toRad(lat2);
      const Δλ = toRad(lon2 - lon1);

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x =
        Math.cos(φ1) * Math.sin(φ2) -
        Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);

      const θ = Math.atan2(y, x);
      return (toDeg(θ) + 360) % 360;
    }

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = deg => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function getShipperBearing(shipper, lat, lng) {
      const key = getShipperKey(shipper);

      // 1. Nếu API có sẵn heading/bearing/angle
      const apiHeading = toNumber(shipper.heading ?? shipper.bearing ?? shipper.angle ?? shipper.course);
      if (apiHeading !== null) {
        shipperPrevPositions.set(key, { lat, lng, bearing: apiHeading });
        return apiHeading;
      }

      // 2. Tính toán dựa trên tọa độ trước đó
      const prev = shipperPrevPositions.get(key);
      if (!prev) {
        shipperPrevPositions.set(key, { lat, lng, bearing: 0 });
        return 0;
      }

      const dist = calculateDistanceMeters(prev.lat, prev.lng, lat, lng);
      // Di chuyển từ 3m trở lên mới cập nhật góc để tránh giật góc do GPS sai số tại chỗ
      if (dist >= 3) {
        const bearing = calculateBearing(prev.lat, prev.lng, lat, lng);
        shipperPrevPositions.set(key, { lat, lng, bearing });
        return bearing;
      }

      return prev.bearing || 0;
    }

    function renderShippers(shippers) {
      shipperLayer.clearLayers();

      shippers.forEach(shipper => {
        if (!isShipperVisible(shipper)) return;

        const lat = toNumber(shipper.latitude ?? shipper.lat);
        const lng = toNumber(shipper.longitude ?? shipper.lng ?? shipper.lon);
        if (lat === null || lng === null) return;

        const name = shipper?.user?.name || shipper?.name || "Shipper";
        const online = shipper?.is_online === true;
        const bearing = getShipperBearing(shipper, lat, lng);

        const icon = L.divIcon({
          className: "",
          html: `
            <div class="shipper-car-marker">
              <div class="shipper-car-body ${online ? "" : "shipper-car-offline"}" style="transform: rotate(${Math.round(bearing)}deg);">
                ${getShipperCarSvg()}
              </div>
            </div>
          `,
          iconSize: [32, 52],
          iconAnchor: [16, 26]
        });

        const popup = `
          <div>
            <div class="popup-title">${escapeHtml(name)}</div>
            <div class="popup-line">${escapeHtml(shipper.speed ?? 0)} km/h</div>
          </div>
        `;

        L.marker([lat, lng], {
          icon,

        })
          .bindPopup(popup)
          .addTo(shipperLayer);

    async function loadShippers() {
      const payload = await fetchJson(`${API_BASE}/shipper-locations`);
      const shippers = unwrapList(payload);

      lastShippers = shippers;
      renderShipperStatus(shippers);
      renderShipperFilter(shippers);
      renderShippers(shippers);

      return shippers;
    }


    async function refreshAll() {
      if (refreshing || !appUnlocked) return;

      const isStillValid = await syncLatestPassword();
      if (!isStillValid || !hasSavedAccess()) {
        return;
      }

      refreshing = true;
      els.reloadButton.classList.add("loading");
      els.reloadButton.disabled = true;
      els.lastUpdate.textContent = "Đang tải...";

      try {
        await Promise.all([loadOrders(), loadShippers()]);

        els.lastUpdate.textContent =
          new Date().toLocaleTimeString("vi-VN", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          });
      } catch (err) {
        console.error("Lỗi cập nhật dữ liệu:", err);
        els.lastUpdate.textContent = "Lỗi";
      } finally {
        refreshing = false;
        els.reloadButton.classList.remove("loading");
        els.reloadButton.disabled = false;
      }
    }

    function startPolling(options = {}) {
      stopPolling();
      if (options.resetView) {
        resetMapToRestaurant();
      }
      refreshAll();
      refreshTimer = setInterval(refreshAll, REFRESH_MS);
    }

    function stopPolling() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopPolling();
      } else {
        handleAppResume();
      }
    });

    window.addEventListener("pageshow", event => {
      if (!document.hidden) {
        handleAppResume();
      }
    });

    window.addEventListener("focus", () => {
      if (!document.hidden) {
        handleAppResume();
      }
    });

    (async () => {
      await syncLatestPassword();
      if (hasSavedAccess()) {
        unlockApp();
      } else {
        lockApp();
      }
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(err => {
          console.warn("Service Worker không đăng ký được:", err);
        });
      });
    }
  </script>
