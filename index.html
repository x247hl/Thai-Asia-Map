    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function toNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function unwrapList(payload) {
      if (Array.isArray(payload)) return payload;
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload?.data?.data)) return payload.data.data;
      return [];
    }

    function unwrapPage(payload) {
      if (Array.isArray(payload)) {
        return { items: payload, lastPage: 1 };
      }

      if (Array.isArray(payload?.data)) {
        return { items: payload.data, lastPage: 1 };
      }

      if (Array.isArray(payload?.data?.data)) {
        return {
          items: payload.data.data,
          lastPage: Math.max(1, Number(payload.data.last_page) || 1)
        };
      }

      return { items: [], lastPage: 1 };
    }

    async function fetchJson(url) {
      const freshUrl = new URL(url, window.location.href);
      freshUrl.searchParams.set("_", String(Date.now()));

      const res = await fetch(freshUrl.toString(), { cache: "no-store" });
      if (!res.ok) throw new Error(`${res.status} ${url}`);
      return res.json();
    }

    function orderStatusUrl(status, page) {
      return `${API_BASE}/dh/?page=${page}&status=${encodeURIComponent(status)}`;
    }

    async function fetchOrdersByStatus(status) {
      const firstPayload = await fetchJson(orderStatusUrl(status, 1));
      const firstPage = unwrapPage(firstPayload);

      if (firstPage.lastPage <= 1) {
        return firstPage.items;
      }

      const restPages = [];
      for (let page = 2; page <= firstPage.lastPage; page++) {
        restPages.push(page);
      }

      const restPayloads = await Promise.all(
        restPages.map(page => fetchJson(orderStatusUrl(status, page)))
      );

      return firstPage.items.concat(
        ...restPayloads.map(payload => unwrapPage(payload).items)
      );
    }

    let productCatalog = new Map();
    let productCatalogLoadedAt = 0;

    async function loadProductCatalog() {
      if (productCatalog.size > 0 && (Date.now() - productCatalogLoadedAt < 600000)) {
        return productCatalog;
      }
      try {
        const res = await fetchJson(`${API_BASE}/products`);
        const categories = Array.isArray(res?.data?.data) ? res.data.data : (Array.isArray(res?.data) ? res.data : []);
        const map = new Map();
        categories.forEach(cat => {
          const types = Array.isArray(cat?.product_types) ? cat.product_types : (Array.isArray(cat?.types) ? cat.types : []);
          types.forEach(pt => {
            const prefixCode = pt?.prefix_code || null;
            const products = Array.isArray(pt?.products) ? pt.products : [];
            products.forEach(p => {
              if (p?.id) {
                map.set(String(p.id), {
                  id: p.id,
                  name: p.name || "",
                  code: p.code != null ? String(p.code) : "",
                  prefix_code: p.prefix_code || prefixCode || "",
                  price: p.price
                });
              }
            });
          });
        });
        if (map.size > 0) {
          productCatalog = map;
          productCatalogLoadedAt = Date.now();
        }
        return productCatalog;
      } catch (err) {
        console.warn("Không tải được danh mục sản phẩm:", err);
        return productCatalog;
      }
    }

    async function loadOrders() {
      await loadProductCatalog();
      const selected = els.statusFilter.value;

      let statuses;
      if (selected === "all") {
        // "Tất cả": gộp 4 trạng thái đã xác nhận từ API.
        statuses = ["new", "inprocess", "complete", "cancel"];
      } else if (selected === "inprocess") {
        // "Tiếp nhận & Mới": hiển thị và cập nhật cả đơn Mới và đơn Tiếp nhận
        statuses = ["new", "inprocess"];
      } else {
        statuses = [selected];
      }

      const results = await Promise.all(
        statuses.map(status => fetchOrdersByStatus(status))
      );

      let orders = results.flat();

      // Tránh trùng đơn nếu backend trả cùng đơn ở nhiều trạng thái.
      const unique = new Map();
      orders.forEach(order => {
        const key = getOrderKey(order);
        unique.set(key, order);
        knownOrdersMap.set(key, order);
      });
      orders = Array.from(unique.values());

      // Mặc định trên bản đồ luôn chỉ hiện đơn giao hàng
      orders = orders.filter(order => order.shipping_method === "home_delivery");

      renderOrders(orders);
      return orders;
    }

    function orderStatusText(status, statusTitle) {
      if (statusTitle) return statusTitle;
      if (status === "new") return "Đơn mới";
      if (status === "inprocess") return "Tiếp nhận";
      if (status === "complete") return "Hoàn thành";
      if (status === "cancel") return "Hủy";
      return status || "Không rõ";
    }

    function isScheduledOrder(order) {
      const time = String(order?.time || "").trim().toLowerCase();
      return time !== "" && !time.includes("schnell") && !time.includes("asap") && !time.includes("ngay") && !time.includes("mög");
    }

    function isScheduledInprocessOrder(order) {
      return (order?.status === "inprocess" || order?.status === "new") && isScheduledOrder(order);
    }

    function orderClass(order) {
      const status = order?.status ?? "";

      if (status === "cancel") return "order-cancel";
      if (status === "complete") {
        if (isScheduledOrder(order)) return "order-complete-scheduled";
        return "order-complete";
      }
      if (isScheduledInprocessOrder(order)) return "order-inprocess-scheduled";
      if (status === "new") return "order-new";
      return "order-inprocess";
    }

    function formatOrderTime(createdAt) {
      if (!createdAt) return "";
      const d = new Date(createdAt);
      if (Number.isNaN(d.getTime())) return "";

      return new Intl.DateTimeFormat("vi-VN", {
        timeZone: "Europe/Berlin",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(d);
    }

    function getDisplayOrderTime(order) {
      if (!order) return "";
      const rawTime = String(order.time || "").trim();
      const lower = rawTime.toLowerCase();
      const additionalMin = Number(order.additional_time) || 0;

      // Trường hợp 1: Có giờ hẹn cụ thể (không phải schnell wie möglich / asap / ngay)
      if (rawTime && !lower.includes("schnell") && !lower.includes("asap") && !lower.includes("ngay") && !lower.includes("mög")) {
        const match = rawTime.match(/(\d{1,2}):(\d{2})/);
        if (match) {
          let h = parseInt(match[1], 10);
          let m = parseInt(match[2], 10);
          if (!Number.isNaN(h) && !Number.isNaN(m)) {
            if (additionalMin > 0) {
              const totalMins = h * 60 + m + additionalMin;
              h = Math.floor(totalMins / 60) % 24;
              m = totalMins % 60;
            }
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          }
        }
        return rawTime;
      }

      // Trường hợp 2: Đơn thường (schnell wie möglich)
      if (order.created_at) {
        const d = new Date(order.created_at);
        if (!Number.isNaN(d.getTime())) {
          if (additionalMin > 0) {
            d.setMinutes(d.getMinutes() + additionalMin);
          }
          return new Intl.DateTimeFormat("vi-VN", {
            timeZone: "Europe/Berlin",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          }).format(d);
        }
      }

      return formatOrderTime(order.created_at);
    }

    function formatPopupOrderTime(order) {
      if (!order) return "";
      const rawTime = String(order.time || "").trim();
      const additionalMin = Number(order.additional_time) || 0;
      const displayTime = getDisplayOrderTime(order);

      if (additionalMin > 0) {
        if (rawTime && !rawTime.toLowerCase().includes("schnell")) {
          return `${displayTime} (${rawTime} + ${additionalMin}p)`;
        }
        return `${displayTime} (+${additionalMin}p)`;
      }
      return rawTime || displayTime;
    }

    function formatOrderAddress(order) {
      if (!order) return "";
      const street = String(order.address || "").trim();
      const houseNum = String(order.apartment_number || order.house_number || "").trim();
      const postcode = String(order.postcode || "").trim();
      const city = String(order.city || "").trim();

      let streetLine = street;
      if (houseNum) {
        if (!street) {
          streetLine = houseNum;
        } else if (!street.endsWith(houseNum)) {
          streetLine = `${street} ${houseNum}`;
        }
      }

      const cityLine = [postcode, city].filter(Boolean).join(" ");
      return [streetLine, cityLine].filter(Boolean).join(", ");
    }

    function formatOrderDateTime(createdAt) {
      if (!createdAt) return "";
      const d = new Date(createdAt);
      if (Number.isNaN(d.getTime())) return "";

      return new Intl.DateTimeFormat("vi-VN", {
        timeZone: "Europe/Berlin",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(d);
    }

    function formatEuro(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "";
      return new Intl.NumberFormat("de-DE", {
        style: "currency",
        currency: "EUR"
      }).format(n);
    }

    function escapeHtmlWithBreaks(value) {
      return escapeHtml(value).replace(/\r?\n/g, "<br>");
    }

    function formatOrderItemTotal(item) {
      const quantity = Number(item?.quantity);
      const price = Number(item?.product_price);
      if (!Number.isFinite(quantity) || !Number.isFinite(price)) return "";
      return formatEuro(quantity * price);
    }

    function formatOrderItemLabel(item) {
      const quantity = Number(item?.quantity) || 1;
      const catItem = item?.product_id ? productCatalog.get(String(item.product_id)) : null;

      const cleanPrefix = String(item?.prefix_code || catItem?.prefix_code || "").replace(/[\.\:\-\s]+$/, "").trim();
      const rawCode = String(item?.code || catItem?.code || "").replace(/^#+/, "").trim();
      const rawName = String(item?.product_name || item?.name || catItem?.name || "").trim();

      let codeLabel = "";
      if (cleanPrefix && rawCode) {
        if (rawCode.toLowerCase().startsWith(cleanPrefix.toLowerCase())) {
          codeLabel = rawCode;
        } else {
          codeLabel = `${cleanPrefix} ${rawCode}`;
        }
      } else if (rawCode) {
        codeLabel = rawCode;
      } else if (cleanPrefix && rawName) {
        if (rawName.toLowerCase().startsWith(cleanPrefix.toLowerCase())) {
          codeLabel = rawName;
        } else {
          codeLabel = `${cleanPrefix} ${rawName}`;
        }
      } else if (rawName) {
        codeLabel = rawName;
      } else if (cleanPrefix) {
        codeLabel = cleanPrefix;
      } else {
        codeLabel = "Món ăn";
      }

      return `${quantity} x ${codeLabel}`;
    }

    function renderOrderItems(items) {
      if (!Array.isArray(items) || items.length === 0) return "";

      const rows = items.map(item => {
        const itemLabel = formatOrderItemLabel(item);
        const note = String(item?.note || "").trim();

        return `
          <div class="popup-item">
            <span class="popup-item-name">
              <b>${escapeHtml(itemLabel)}</b>${note ? `: <span class="popup-item-note">${escapeHtml(note)}</span>` : ""}
            </span>
          </div>
        `;
      }).join("");

      return `
        <div class="popup-section-title">Thông tin món ăn</div>
        <div class="popup-items">${rows}</div>
      `;
    }

    function focusOrderMarker(lat, lng, zoom = ORDER_FOCUS_ZOOM) {
      if (lat === null || lng === null) return;
      const targetZoom = zoom || map.getZoom();
      const containerHeight = map.getSize().y;

      // Đặt vị trí marker nằm trên nút reload khoảng 85px - 100px từ mép dưới màn hình
      const bottomPadding = Math.min(100, Math.max(75, containerHeight * 0.14));
      const offsetY = (containerHeight / 2) - bottomPadding;

      const point = map.project([lat, lng], targetZoom);
      const newCenterPoint = new L.Point(point.x, point.y - offsetY);
      const newCenterLatLng = map.unproject(newCenterPoint, targetZoom);

      map.setView(newCenterLatLng, targetZoom, { animate: true });
    }

    function getOrderKey(order) {
      return String(order?.id || order?.code || `${order?.latitude}_${order?.longitude}`);
    }

    function renderOrders(orders) {
      isRefreshingOrders = true;
      const prevOpenedKey = openedOrderKey;
      orderLayer.clearLayers();
      openedOrderKey = prevOpenedKey;
      lastOrders = Array.isArray(orders) ? orders : [];

      const points = [];
      let markerToReopen = null;

      orders.forEach(order => {
        const lat = toNumber(order.latitude);
        const lng = toNumber(order.longitude);
        if (lat === null || lng === null) return;

        const time = getDisplayOrderTime(order);
        const code = order.code ?? "?";
        const status = order.status ?? "";
        const orderKey = getOrderKey(order);

        const icon = L.divIcon({
          className: "",
          html: `
            <div class="order-marker ${orderClass(order)}" data-order-key="${escapeHtml(orderKey)}">
              <div class="order-marker-panel">
                #${escapeHtml(code)}
                ${time ? `<br>${escapeHtml(time)}` : ""}
              </div>
              <div class="order-marker-pointer"></div>
              <div class="order-marker-dot"></div>
            </div>
          `,
          iconSize: [64, 58],
          iconAnchor: [32, 52]
        });

        const fullName = `${order.first_name ?? ""} ${order.last_name ?? ""}`.trim();
        const fullAddress = formatOrderAddress(order);
        const isScheduled = isScheduledOrder(order);
        const orderTime = formatPopupOrderTime(order);
        const note = String(order.note || "").trim();
        const noteHtml = note
          ? `
            <div class="popup-section-title">Ghi chú</div>
            <div class="popup-note">${escapeHtmlWithBreaks(note)}</div>
          `
          : "";

        const popup = `
          <div class="order-popup">
            <div class="order-popup-header">
              <span class="popup-title">Đơn #${escapeHtml(code)}</span>
              ${order.created_at ? `<span class="order-popup-time">${escapeHtml(formatOrderDateTime(order.created_at))}</span>` : ""}
            </div>
            <div class="popup-line"><b>${escapeHtml(orderStatusText(status, order.status_title))}</b></div>
            ${fullName ? `<div class="popup-line">${escapeHtml(fullName)}</div>` : ""}
            ${fullAddress ? `<div class="popup-line">${escapeHtml(fullAddress)}</div>` : ""}
            ${orderTime ? `<div class="popup-line">Thời gian: ${escapeHtml(orderTime)}</div>` : ""}
            ${noteHtml}
            ${renderOrderItems(order.items)}
            ${SHOW_ORDER_TOTAL ? `<div class="popup-line">Tổng: ${escapeHtml(formatEuro(order.total))}</div>` : ""}
          </div>
        `;

        const marker = L.marker([lat, lng], { icon })
          .bindPopup(popup, {
            maxWidth: 400,
            minWidth: 280,
            autoPan: false
          })
          .addTo(orderLayer);

        marker.on("click", () => {
          stopFollowShipper();
          const inRoute = routeOrderKeys.includes(orderKey);

          if (inRoute) {
            // Đơn đã được chọn ghép -> click lại để bỏ khỏi lộ trình
            routeOrderKeys = routeOrderKeys.filter(key => key !== orderKey);
            if (routeOrderKeys.length === 0) {
              isRoutingArmed = false;
              lastInteractedOrderKey = null;
              routeStartType = null;
              routeReturnToShop = false;
            } else {
              lastInteractedOrderKey = routeOrderKeys[routeOrderKeys.length - 1];
            }
            marker.closePopup();
            map.closePopup();
            updateRouteReadyOrderMarkerUi();
            updateRouteToggleButtonsUi();
            renderRoutePanelUi();
            calculateAndDrawRoute();
            if (routeOrderKeys.length === 0) {
              toggleRoutePanel(false);
            }
            return;
          }

          if (!isRoutingArmed && routeOrderKeys.length === 0 && lastInteractedOrderKey === orderKey) {
            // Đơn đầu tiên đang chờ ghép -> click lại để bỏ trạng thái chờ ghép
            lastInteractedOrderKey = null;
            marker.closePopup();
            map.closePopup();
            updateRouteReadyOrderMarkerUi();
            updateRouteToggleButtonsUi();
            renderRoutePanelUi();
            return;
          }

          if (isRoutingArmed || routeOrderKeys.length > 0) {
            // Đã chọn shipper/quán hoặc đã có đơn trong tuyến -> Nối tiếp đơn này vào tuyến
            setTimeout(() => {
              marker.closePopup();
              map.closePopup();
            }, 0);
            routeOrderKeys.push(orderKey);
            isRoutingArmed = true;
            lastInteractedOrderKey = orderKey;
            updateRouteReadyOrderMarkerUi();
            updateRouteToggleButtonsUi();
            renderRoutePanelUi();
            calculateAndDrawRoute();
            toggleRoutePanel(true);
            return;
          }

          // Chưa kích hoạt nối ghép (vừa reload, chưa click shipper/quán):
          if (!lastInteractedOrderKey || lastInteractedOrderKey === orderKey) {
            // Lần click đầu tiên vào đơn -> Mở popup thông tin đơn hàng bình thường
            lastInteractedOrderKey = orderKey;
            focusOrderMarker(lat, lng, ORDER_FOCUS_ZOOM);
            marker.openPopup();
            updateRouteReadyOrderMarkerUi();
            updateRouteToggleButtonsUi();
          } else {
            // Trước đó đã click vào 1 đơn khác (ví dụ: đã xem #9 rồi tắt/chuyển qua #7) -> Nối ghép #9 và #7!
            setTimeout(() => {
              marker.closePopup();
              map.closePopup();
            }, 0);
            const prevKey = lastInteractedOrderKey;
            if (!routeOrderKeys.includes(prevKey)) {
              routeOrderKeys.push(prevKey);
            }
            if (!routeOrderKeys.includes(orderKey)) {
              routeOrderKeys.push(orderKey);
            }
            isRoutingArmed = true;
            lastInteractedOrderKey = orderKey;
            updateRouteReadyOrderMarkerUi();
            updateRouteToggleButtonsUi();
            renderRoutePanelUi();
            calculateAndDrawRoute();
            toggleRoutePanel(true);
          }
        });

        marker.on("popupopen", () => {
          openedOrderKey = orderKey;
        });

        marker.on("popupclose", () => {
          if (!isRefreshingOrders && openedOrderKey === orderKey) {
            openedOrderKey = null;
          }
        });

        if (openedOrderKey === orderKey) {
          markerToReopen = marker;
        }

        points.push([lat, lng]);
      });

      if (openedOrderKey && markerToReopen) {
        markerToReopen.openPopup();
      }
      isRefreshingOrders = false;

      renderRoutePanelUi();
      updateRouteReadyOrderMarkerUi();
      updateRouteToggleButtonsUi();
      calculateAndDrawRoute();

      els.orderCount.textContent = String(orders.length);
      els.orderSummary.classList.toggle("has-orders", orders.length >= 1);
      els.orderSummary.classList.toggle("no-orders", orders.length === 0);
    }

    // ===== MULTI-STOP ROUTE PLANNER CORE =====
    function isRouteReadyOrderKey(orderKey) {
      return !!orderKey
        && (
          routeOrderKeys.includes(orderKey)
          || (lastInteractedOrderKey === orderKey && !isRoutingArmed && routeOrderKeys.length === 0)
        );
    }

    function updateRouteReadyOrderMarkerUi() {
      orderLayer.getLayers().forEach(layer => {
        const markerEl = typeof layer.getElement === "function" ? layer.getElement() : null;
        const orderEl = markerEl ? markerEl.querySelector(".order-marker[data-order-key]") : null;
        if (!orderEl) return;
        orderEl.classList.toggle("route-ready", isRouteReadyOrderKey(orderEl.dataset.orderKey));
      });
    }

    function updateRouteToggleButtonsUi() {
      document.querySelectorAll(".btn-toggle-route[data-order-key]").forEach(btn => {
        const inRoute = routeOrderKeys.includes(btn.dataset.orderKey);
        btn.classList.toggle("in-route", inRoute);
        btn.innerHTML = inRoute ? "➖ Bỏ khỏi lộ trình" : "➕ Thêm vào lộ trình";
      });
    }

    function updateRouteBadge() {
      const count = routeOrderKeys.length;
      if (els.routeBadge) {
        els.routeBadge.textContent = String(count);
        els.routeBadge.classList.toggle("hidden", count === 0);
      }
      if (els.routeStopCount) {
        els.routeStopCount.textContent = `${count} đơn`;
      }
      if (els.routeOptimizeBtn) {
        els.routeOptimizeBtn.disabled = count < 2;
      }
      if (els.routeFitViewBtn) {
        els.routeFitViewBtn.disabled = count === 0;
      }
      if (els.routeClearBtn) {
        els.routeClearBtn.disabled = count === 0;
      }
    }

    function toggleRoutePanel(forceState) {
      if (!els.routePanel) return;
      const willShow = typeof forceState === "boolean" ? forceState : !els.routePanel.classList.contains("show");
      els.routePanel.classList.toggle("show", willShow);
      if (els.routeButton) {
        els.routeButton.classList.toggle("active", willShow);
      }
      if (willShow) {
        if (els.filterPanel) els.filterPanel.classList.remove("open");
        renderRoutePanelUi();
      }
    }

    function renderRoutePanelUi() {
      updateRouteBadge();
      const renderId = ++routeAnalysisRenderId;
      updateRouteSuggestionBanner(renderId);
    }

    let toastTimer = null;
    function showToast(message, duration = 2800) {
      if (!els.mapToast) return;
      els.mapToast.textContent = message;
      els.mapToast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        if (els.mapToast) els.mapToast.classList.remove("show");
      }, duration);
    }

    function parseOrderSchedule(order) {
      if (!order) return { isScheduled: false, targetMinutesFromNow: 0 };
      const rawTime = String(order.time || "").trim().toLowerCase();
      const additionalMin = Number(order.additional_time) || 0;
      if (!rawTime || rawTime.includes("schnell") || rawTime.includes("asap") || rawTime.includes("ngay") || rawTime.includes("mög")) {
        return { isScheduled: false, targetMinutesFromNow: 0 };
      }

      const match = rawTime.match(/(\d{1,2}):(\d{2})/);
      if (!match) return { isScheduled: false, targetMinutesFromNow: 0 };

      const h = parseInt(match[1], 10);
      const m = parseInt(match[2], 10);
      if (Number.isNaN(h) || Number.isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) {
        return { isScheduled: false, targetMinutesFromNow: 0 };
      }

      const now = new Date();
      const target = new Date(now);
      target.setHours(h, m, 0, 0);
      if (additionalMin > 0) {
        target.setMinutes(target.getMinutes() + additionalMin);
      }

      let diffMin = (target.getTime() - now.getTime()) / 60000;
      if (diffMin < -600) {
        target.setDate(target.getDate() + 1);
        diffMin = (target.getTime() - now.getTime()) / 60000;
      }

      return {
        isScheduled: true,
        targetMinutesFromNow: diffMin
      };
    }

    function getOrderWaitTimeMinutes(order) {
      if (!order || !order.created_at) return 0;
      const created = new Date(order.created_at);
      if (Number.isNaN(created.getTime())) return 0;
      return Math.max(0, (Date.now() - created.getTime()) / 60000);
    }

    function getPermutations(arr) {
      if (!Array.isArray(arr) || arr.length <= 1) return [arr];
      if (arr.length === 2) return [arr, [arr[1], arr[0]]];
      const result = [];
      for (let i = 0; i < arr.length; i++) {
        const current = arr[i];
        const remaining = arr.slice(0, i).concat(arr.slice(i + 1));
        const subPerms = getPermutations(remaining);
        for (let j = 0; j < subPerms.length; j++) {
          result.push([current].concat(subPerms[j]));
        }
      }
      return result;
    }

    function getRouteOrderLabel(key) {
      const order = lastOrders.find(o => getOrderKey(o) === key);
      return `#${order?.code ?? order?.id ?? key ?? "?"}`;
    }

    function getRoutePathLabel(perm) {
      return (perm || []).map(getRouteOrderLabel).join(" → ");
    }

    function formatRouteMinutes(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "0p";
      if (Math.abs(n) < 1) return "<1p";
      return `${Math.round(n)}p`;
    }

    function formatRouteKmFromMeters(value) {
      const n = Number(value) || 0;
      if (n < 1000) return `${Math.round(n)}m`;
      return `${(n / 1000).toFixed(1)}km`;
    }

    function formatRouteClockFromNow(minutesFromNow) {
      const d = new Date(Date.now() + (Number(minutesFromNow) || 0) * 60000);
      return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
    }

    function getRouteStartPoint() {
      if (routeStartType && routeStartType.startsWith("shipper:")) {
        const shipperKey = routeStartType.replace("shipper:", "");
        const shipper = lastShippers.find(s => getShipperKey(s) === shipperKey);
        const lat = toNumber(shipper?.latitude ?? shipper?.lat);
        const lng = toNumber(shipper?.longitude ?? shipper?.lng ?? shipper?.lon);
        if (lat !== null && lng !== null) {
          return {
            id: "__start__",
            label: shipper?.user?.name || shipper?.name || "Shipper",
            lat,
            lng
          };
        }
      }

      if (!routeStartType) return null;

      return {
        id: "__start__",
        label: "Tại quán",
        lat: RESTAURANT.lat,
        lng: RESTAURANT.lng
      };
    }

    function getOrderRoutePoint(key) {
      const order = lastOrders.find(o => getOrderKey(o) === key);
      if (!order) return null;
      const lat = toNumber(order.latitude);
      const lng = toNumber(order.longitude);
      if (lat === null || lng === null) return null;
      return {
        id: key,
        label: getRouteOrderLabel(key),
        order,
        lat,
        lng
      };
    }

    function buildRouteOptimizationPoints(keys) {
      const startPoint = getRouteStartPoint();
      const points = [];
      const pointIndexById = new Map();
      const skippedKeys = [];

      if (startPoint) {
        pointIndexById.set(startPoint.id, points.length);
        points.push(startPoint);
      }

      (keys || []).forEach(key => {
        const point = getOrderRoutePoint(key);
        if (!point) {
          skippedKeys.push(key);
          return;
        }
        pointIndexById.set(key, points.length);
        points.push(point);
      });

      let returnPointId = "__start__";
      if (routeReturnToShop) {
        const isStartAtRestaurant = startPoint
          && Math.abs(startPoint.lat - RESTAURANT.lat) < 0.000001
          && Math.abs(startPoint.lng - RESTAURANT.lng) < 0.000001;
        if (!isStartAtRestaurant) {
          returnPointId = "__return_shop__";
          pointIndexById.set(returnPointId, points.length);
          points.push({
            id: returnPointId,
            label: "Về Quán",
            lat: RESTAURANT.lat,
            lng: RESTAURANT.lng
          });
        }
      }

      return {
        points,
        pointIndexById,
        startPoint,
        startPointId: startPoint ? "__start__" : null,
        returnPointId,
        skippedKeys
      };
    }

    function getRouteAnalysisCacheKey(keys) {
      const startPoint = getRouteStartPoint();
      const pointSig = (startPoint ? [startPoint] : [])
        .concat((keys || []).map(getOrderRoutePoint).filter(Boolean))
        .concat(routeReturnToShop ? [{ lat: RESTAURANT.lat, lng: RESTAURANT.lng }] : [])
        .map(pt => `${Number(pt.lat).toFixed(6)},${Number(pt.lng).toFixed(6)}`)
        .join("|");
      return [
        routeStartType || "restaurant-default",
        routeReturnToShop ? "return" : "oneway",
        (keys || []).join(","),
        pointSig
      ].join("::");
    }

    async function fetchOsrmRouteMatrix(keys) {
      const cacheKey = getRouteAnalysisCacheKey(keys);
      if (routeAnalysisCache?.key === cacheKey) {
        const ageMs = Date.now() - (routeAnalysisCache.savedAt || 0);
        const ttlMs = routeAnalysisCache.value?.mode === "osrm" ? 60000 : 10000;
        if (ageMs < ttlMs) {
          return routeAnalysisCache.value;
        }
      }

      if (routeAnalysisCache?.key === cacheKey && routeAnalysisCache.pending) {
        return routeAnalysisCache.pending;
      }

      const pending = (async () => {
        const context = buildRouteOptimizationPoints(keys);
        if (context.points.length < 2) {
          const value = { ...context, mode: "estimate", durations: null, distances: null, error: "not-enough-points" };
          routeAnalysisCache = { key: cacheKey, value, savedAt: Date.now(), pending: null };
          return value;
        }

        const coords = context.points.map(pt => `${pt.lng},${pt.lat}`).join(";");
        const url = `${ROUTE_OSRM_TABLE_URL}/${coords}?annotations=duration,distance`;

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!data || data.code !== "Ok" || !Array.isArray(data.durations)) {
            throw new Error(data?.message || "OSRM table failed");
          }

          const value = {
            ...context,
            mode: "osrm",
            durations: data.durations,
            distances: Array.isArray(data.distances) ? data.distances : null,
            error: null
          };
          routeAnalysisCache = { key: cacheKey, value, savedAt: Date.now(), pending: null };
          return value;
        } catch (err) {
          console.warn("Không lấy được OSRM Table, dùng ước lượng cũ:", err);
          const value = {
            ...context,
            mode: "estimate",
            durations: null,
            distances: null,
            error: err?.message || String(err)
          };
          routeAnalysisCache = { key: cacheKey, value, savedAt: Date.now(), pending: null };
          return value;
        }
      })();

      routeAnalysisCache = { key: cacheKey, value: null, savedAt: 0, pending };
      return pending;
    }

    function getMatrixLeg(routeMatrix, fromPointId, toPointId) {
      if (!routeMatrix || routeMatrix.mode !== "osrm") return null;
      const fromIdx = routeMatrix.pointIndexById.get(fromPointId);
      const toIdx = routeMatrix.pointIndexById.get(toPointId);
      if (fromIdx === undefined || toIdx === undefined) return null;
      const durationSec = routeMatrix.durations?.[fromIdx]?.[toIdx];
      if (!Number.isFinite(durationSec)) return null;
      const distanceMeters = routeMatrix.distances?.[fromIdx]?.[toIdx];
      return {
        travelMin: durationSec / 60,
        distanceMeters: Number.isFinite(distanceMeters) ? distanceMeters : null,
        mode: "osrm"
      };
    }

    function analyzeRouteOrderPermutation(perm, routeMatrix = null) {
      let startLat = RESTAURANT.lat;
      let startLng = RESTAURANT.lng;
      let startLabel = "Chưa chọn điểm xuất phát";
      let hasFixedStart = false;
      if (routeMatrix?.startPoint) {
        startLat = routeMatrix.startPoint.lat;
        startLng = routeMatrix.startPoint.lng;
        startLabel = routeMatrix.startPoint.label;
        hasFixedStart = true;
      } else if (routeStartType && routeStartType.startsWith("shipper:")) {
        const shipperKey = routeStartType.replace("shipper:", "");
        const shipper = lastShippers.find(s => getShipperKey(s) === shipperKey);
        const sLat = toNumber(shipper?.latitude ?? shipper?.lat);
        const sLng = toNumber(shipper?.longitude ?? shipper?.lng ?? shipper?.lon);
        if (sLat !== null && sLng !== null) {
          startLat = sLat;
          startLng = sLng;
          startLabel = shipper?.user?.name || shipper?.name || "Shipper";
          hasFixedStart = true;
        }
      } else if (routeStartType === "restaurant") {
        startLabel = "Tại quán";
        hasFixedStart = true;
      }

      let currentLat = hasFixedStart ? startLat : null;
      let currentLng = hasFixedStart ? startLng : null;
      let currentLabel = startLabel;
      let currentPointId = hasFixedStart ? "__start__" : null;
      let totalTravelMin = 0;
      let estimatedDistanceMeters = 0;
      let fallbackLegCount = 0;
      const orderMetaList = [];
      const skippedKeys = [];

      for (let i = 0; i < perm.length; i++) {
        const key = perm[i];
        const order = lastOrders.find(o => getOrderKey(o) === key);
        if (!order) {
          skippedKeys.push(key);
          continue;
        }

        const oLat = toNumber(order.latitude);
        const oLng = toNumber(order.longitude);
        if (oLat === null || oLng === null) {
          skippedKeys.push(key);
          continue;
        }

        const isFirstWithoutStart = currentPointId === null;
        const straightDistMeters = isFirstWithoutStart ? 0 : calculateDistanceMeters(currentLat, currentLng, oLat, oLng);
        let estimatedLegMeters = straightDistMeters * ROUTE_ESTIMATE_DISTANCE_FACTOR;
        let legTravelMin = estimatedLegMeters / ROUTE_ESTIMATE_SPEED_M_PER_MIN;
        let legMode = isFirstWithoutStart ? "start" : "estimate";
        const matrixLeg = currentPointId === null ? null : getMatrixLeg(routeMatrix, currentPointId, key);
        if (matrixLeg) {
          legTravelMin = matrixLeg.travelMin;
          if (matrixLeg.distanceMeters !== null) estimatedLegMeters = matrixLeg.distanceMeters;
          legMode = "osrm";
        } else if (routeMatrix?.mode === "osrm") {
          fallbackLegCount++;
        }
        totalTravelMin += legTravelMin;
        estimatedDistanceMeters += estimatedLegMeters;

        const tripTime = totalTravelMin + i * ROUTE_STOP_SERVICE_MIN;
        const schedule = parseOrderSchedule(order);
        const waitMin = getOrderWaitTimeMinutes(order);
        const label = getRouteOrderLabel(key);
        const displayTime = getDisplayOrderTime(order);
        const rawTime = String(order.time || "").trim();
        const timingLabel = schedule.isScheduled
          ? `${label}: giờ hẹn ${displayTime || formatRouteClockFromNow(schedule.targetMinutesFromNow)}`
          : (displayTime
            ? `${label}: app coi là đơn thường; ${displayTime} là giờ hiển thị, không phải giờ hẹn`
            : `${label}: app coi là đơn thường`);

        orderMetaList.push({
          key,
          order,
          label,
          displayTime,
          rawTime,
          timingLabel,
          schedule,
          waitMin,
          tripTime,
          legTravelMin,
          straightDistMeters,
          estimatedLegMeters,
          legMode,
          fromLabel: currentLabel
        });

        currentLat = oLat;
        currentLng = oLng;
        currentLabel = label;
        currentPointId = key;
      }

      let maxAllowedD = Infinity;
      let idealD = Infinity;
      let hasScheduled = false;

      for (let i = 0; i < orderMetaList.length; i++) {
        const item = orderMetaList[i];
        if (item.schedule.isScheduled) {
          hasScheduled = true;
          const targetArrival = item.schedule.targetMinutesFromNow;
          const neededD = targetArrival - item.tripTime;
          if (neededD < idealD) {
            idealD = neededD;
          }
        } else {
          const limitD = Math.max(0, ROUTE_NORMAL_WAIT_LIMIT_MIN - item.waitMin - item.tripTime);
          if (limitD < maxAllowedD) {
            maxAllowedD = limitD;
          }
        }
      }

      let departureOffset = 0;
      if (hasScheduled) {
        departureOffset = Math.max(0, Math.min(idealD, maxAllowedD));
        if (!Number.isFinite(departureOffset)) departureOffset = 0;
      }

      let totalPenalty = 0;
      let schedulePenalty = 0;
      let normalWaitPenalty = 0;
      let sequencePenalty = 0;
      const scheduledStops = [];
      const stopDetails = [];
      const reasons = [];

      for (let i = 0; i < orderMetaList.length; i++) {
        const item = orderMetaList[i];
        const arrivalFromNow = departureOffset + item.tripTime;
        const detail = {
          key: item.key,
          label: item.label,
          fromLabel: item.fromLabel,
          travelMin: item.legTravelMin,
          mode: item.legMode,
          arrivalFromNow,
          arrivalClock: formatRouteClockFromNow(arrivalFromNow),
          waitMin: item.waitMin,
          isScheduled: item.schedule.isScheduled,
          timingLabel: item.timingLabel,
          notes: []
        };

        if (item.schedule.isScheduled) {
          const targetMin = item.schedule.targetMinutesFromNow;
          detail.targetClock = formatRouteClockFromNow(targetMin);
          if (arrivalFromNow < targetMin) {
            const earlyMin = targetMin - arrivalFromNow;
            const penalty = earlyMin * 0.2;
            totalPenalty += penalty;
            schedulePenalty += penalty;
            detail.notes.push(`đến sớm ${formatRouteMinutes(earlyMin)} so với giờ hẹn`);
          } else if (arrivalFromNow <= targetMin + ROUTE_SCHEDULE_GRACE_MIN) {
            detail.notes.push(`đến trong ngưỡng hẹn ${detail.targetClock}`);
          } else {
            const lateMin = arrivalFromNow - (targetMin + ROUTE_SCHEDULE_GRACE_MIN);
            const penalty = Math.pow(lateMin, 2) * 5;
            totalPenalty += penalty;
            schedulePenalty += penalty;
            detail.notes.push(`trễ ${formatRouteMinutes(lateMin)} sau ngưỡng +${ROUTE_SCHEDULE_GRACE_MIN}p`);
          }
          scheduledStops.push({ index: i, targetMin, label: item.label });
        } else {
          const totalWaitAtDelivery = item.waitMin + arrivalFromNow;
          detail.totalWaitAtDelivery = totalWaitAtDelivery;
          if (totalWaitAtDelivery > ROUTE_NORMAL_WAIT_TARGET_MIN) {
            const overMin = totalWaitAtDelivery - ROUTE_NORMAL_WAIT_TARGET_MIN;
            const penalty = Math.pow(overMin, 1.6) * 1.6;
            totalPenalty += penalty;
            normalWaitPenalty += penalty;
            detail.notes.push(`đơn thường chờ khoảng ${formatRouteMinutes(totalWaitAtDelivery)}`);
          } else {
            detail.notes.push(`đơn thường chưa vượt ngưỡng chờ ${ROUTE_NORMAL_WAIT_TARGET_MIN}p`);
          }
        }
        stopDetails.push(detail);
      }

      for (let j = 0; j < scheduledStops.length; j++) {
        for (let k = j + 1; k < scheduledStops.length; k++) {
          const earlierStop = scheduledStops[j];
          const laterStop = scheduledStops[k];
          if (earlierStop.targetMin > laterStop.targetMin + 5) {
            const diff = earlierStop.targetMin - laterStop.targetMin;
            const penalty = diff * 20;
            totalPenalty += penalty;
            sequencePenalty += penalty;
            reasons.push(`${laterStop.label} hẹn sớm hơn ${earlierStop.label} khoảng ${formatRouteMinutes(diff)} nhưng lại bị xếp sau`);
          }
        }
      }

      let returnTravelMin = 0;
      if (routeReturnToShop) {
        const distBack = calculateDistanceMeters(currentLat, currentLng, RESTAURANT.lat, RESTAURANT.lng);
        let estimatedBackMeters = distBack * ROUTE_ESTIMATE_DISTANCE_FACTOR;
        returnTravelMin = estimatedBackMeters / ROUTE_ESTIMATE_SPEED_M_PER_MIN;
        const returnLeg = getMatrixLeg(routeMatrix, currentPointId, routeMatrix?.returnPointId || "__start__");
        if (returnLeg) {
          returnTravelMin = returnLeg.travelMin;
          if (returnLeg.distanceMeters !== null) estimatedBackMeters = returnLeg.distanceMeters;
        } else if (routeMatrix?.mode === "osrm") {
          fallbackLegCount++;
        }
        totalTravelMin += returnTravelMin;
        estimatedDistanceMeters += estimatedBackMeters;
      }

      if (hasScheduled && departureOffset > 0) {
        reasons.unshift(`có thể xuất phát sau ${formatRouteMinutes(departureOffset)} để bớt tới đơn hẹn quá sớm`);
      } else {
        reasons.unshift("đề xuất đi ngay theo thời gian hiện tại");
      }

      if (!hasFixedStart) {
        reasons.unshift("chưa chọn Quán/Shipper làm điểm xuất phát nên app chỉ so đoạn giữa các đơn");
      }

      if (sequencePenalty === 0 && scheduledStops.length >= 2) {
        reasons.push("thứ tự đơn hẹn không bị đảo quá 5p");
      }

      const travelScore = totalTravelMin * 1.25;
      const cost = travelScore + totalPenalty;

      return {
        perm: [...perm],
        pathLabel: getRoutePathLabel(perm),
        startLabel,
        cost,
        travelScore,
        totalPenalty,
        schedulePenalty,
        normalWaitPenalty,
        sequencePenalty,
        totalTravelMin,
        departureOffset,
        estimatedDistanceMeters,
        returnTravelMin,
        routingMode: routeMatrix?.mode === "osrm" ? "osrm" : "estimate",
        matrixError: routeMatrix?.error || null,
        fallbackLegCount,
        hasFixedStart,
        hasScheduled,
        scheduledStops,
        stopDetails,
        skippedKeys,
        reasons
      };
    }

    function evaluateRouteOrderPermutation(perm) {
      return analyzeRouteOrderPermutation(perm).cost;
    }

    async function getRouteOptimizationAnalysis(keys) {
      if (!Array.isArray(keys) || keys.length < 2) return null;
      const routeMatrix = await fetchOsrmRouteMatrix(keys);
      const analyses = getPermutations(keys)
        .map(perm => analyzeRouteOrderPermutation(perm, routeMatrix))
        .sort((a, b) => a.cost - b.cost);
      const currentPath = keys.join("|");
      const currentRank = analyses.findIndex(item => item.perm.join("|") === currentPath);
      const current = currentRank >= 0 ? analyses[currentRank] : analyzeRouteOrderPermutation(keys, routeMatrix);
      return {
        permutationsCount: analyses.length,
        best: analyses[0] || current,
        current,
        currentRank: currentRank >= 0 ? currentRank + 1 : null,
        alternatives: analyses.slice(0, 5),
        all: analyses,
        routeMatrix
      };
    }

    async function getOptimalRoutePermutation(keys) {
      if (!Array.isArray(keys) || keys.length < 2) return keys ? [...keys] : [];
      const analysis = await getRouteOptimizationAnalysis(keys);
      return analysis?.best?.perm ? [...analysis.best.perm] : [...keys];
    }

    function getRoutePointAtDistance(latLngs, cumDist, totalDist, targetDist) {
      if (!totalDist || totalDist <= 0 || !latLngs || latLngs.length < 2) {
        return { lat: 0, lng: 0, bearing: 0 };
      }
      const d = ((targetDist % totalDist) + totalDist) % totalDist;

      let low = 0;
      let high = cumDist.length - 2;
      let idx = 0;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (cumDist[mid] <= d) {
          idx = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      const segLen = cumDist[idx + 1] - cumDist[idx];
      const t = segLen > 0 ? (d - cumDist[idx]) / segLen : 0;
      const p1 = latLngs[idx];
      const p2 = latLngs[idx + 1];

      const lat = p1[0] + t * (p2[0] - p1[0]);
      const lng = p1[1] + t * (p2[1] - p1[1]);
      const bearing = calculateBearing(p1[0], p1[1], p2[0], p2[1]);

      return { lat, lng, bearing };
    }

    async function calculateAndDrawRoute() {
      const requestId = ++routeDrawRequestId;

      if (!routeOrderKeys.length) {
        stopRouteAnimation();
        routeLayerGroup.clearLayers();
        routePolylineOutline = null;
        routePolylineInner = null;
        if (els.routeSummaryBox) els.routeSummaryBox.classList.add("hidden");
        return false;
      }

      const waypoints = [];
      const waypointLabels = [];

      // 1. Start point (chỉ thêm nếu người dùng đã click chọn Shipper hoặc Quán)
      if (routeStartType && routeStartType.startsWith("shipper:")) {
        const shipperKey = routeStartType.replace("shipper:", "");
        const shipper = lastShippers.find(s => getShipperKey(s) === shipperKey);
        const sLat = toNumber(shipper?.latitude ?? shipper?.lat);
        const sLng = toNumber(shipper?.longitude ?? shipper?.lng ?? shipper?.lon);
        if (sLat !== null && sLng !== null) {
          waypoints.push([sLng, sLat]);
          waypointLabels.push(shipper?.user?.name || shipper?.name || "Shipper");
        }
      } else if (routeStartType === "restaurant") {
        waypoints.push([RESTAURANT.lng, RESTAURANT.lat]);
        waypointLabels.push("Tại quán");
      }

      // 2. Ordered delivery stops
      routeOrderKeys.forEach((key, i) => {
        const order = lastOrders.find(o => getOrderKey(o) === key);
        if (order) {
          const oLat = toNumber(order.latitude);
          const oLng = toNumber(order.longitude);
          if (oLat !== null && oLng !== null) {
            waypoints.push([oLng, oLat]);
            waypointLabels.push(`Đơn #${order.code ?? (i + 1)}`);
          }
        }
      });

      // 3. Return to restaurant
      if (routeReturnToShop && waypoints.length >= 2) {
        waypoints.push([RESTAURANT.lng, RESTAURANT.lat]);
        waypointLabels.push("Về Quán");
      }

      if (waypoints.length < 2) {
        stopRouteAnimation();
        routeLayerGroup.clearLayers();
        routePolylineOutline = null;
        routePolylineInner = null;
        if (els.routeSummaryBox) els.routeSummaryBox.classList.add("hidden");
        return false;
      }

      try {
        const coordsStr = waypoints.map(pt => `${pt[0]},${pt[1]}`).join(";");
        const url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`;

        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (requestId !== routeDrawRequestId) {
          return false;
        }

        if (!data || data.code !== "Ok" || !Array.isArray(data.routes) || !data.routes.length) {
          throw new Error("Không tìm thấy lộ trình");
        }

        stopRouteAnimation();
        const route = data.routes[0];
        routeLayerGroup.clearLayers();

        const latLngs = route.geometry.coordinates.map(c => [c[1], c[0]]);

        routePolylineOutline = L.polyline(latLngs, {
          color: "#ffffff",
          weight: 9,
          opacity: 0.95,
          lineJoin: "round",
          lineCap: "round"
        }).addTo(routeLayerGroup);

        routePolylineInner = L.polyline(latLngs, {
          color: "#7c3aed",
          weight: 5.5,
          opacity: 0.98,
          lineJoin: "round",
          lineCap: "round"
        }).addTo(routeLayerGroup);

        // Animated Flowing Navigation Stream along Route
        const routeFlowLine = L.polyline(latLngs, {
          color: "#ffffff",
          weight: 2.2,
          opacity: 0.85,
          className: "route-flowing-line",
          lineJoin: "round",
          lineCap: "round",
          interactive: false
        }).addTo(routeLayerGroup);

        // Precompute cumulative distances along route polyline
        const cumDist = [0];
        for (let i = 0; i < latLngs.length - 1; i++) {
          const d = calculateDistanceMeters(latLngs[i][0], latLngs[i][1], latLngs[i + 1][0], latLngs[i + 1][1]);
          cumDist.push(cumDist[i] + d);
        }
        const totalRouteDist = cumDist[cumDist.length - 1];

        // Animate arrows directly on the route SVG path to avoid Leaflet marker jitter.
        const flowPath = routeFlowLine?._path;
        if (totalRouteDist >= 50 && flowPath && typeof flowPath.getTotalLength === "function") {
          const pathLengthPx = flowPath.getTotalLength();
          const arrowParent = flowPath.parentNode;

          if (pathLengthPx > 0 && arrowParent) {
            const SVG_NS = "http://www.w3.org/2000/svg";
            const numArrows = Math.max(2, Math.min(10, Math.round(pathLengthPx / 150)));
            const stepPx = pathLengthPx / numArrows;

            for (let k = 0; k < numArrows; k++) {
              const arrowEl = document.createElementNS(SVG_NS, "path");
              arrowEl.setAttribute("class", "route-moving-arrow-svg");
              arrowEl.setAttribute("d", "M 0 -8 L 6 7 L 0 4 L -6 7 Z");
              arrowParent.appendChild(arrowEl);

              movingArrowMarkers.push({
                arrowEl,
                offsetPx: k * stepPx
              });
            }

            const SPEED_PX_PER_SEC = 75;
            const FLOW_DASH_PATTERN_PX = 28;
            const animationStart = performance.now();

            const getAngleAtPathPx = (path, distancePx) => {
              const d1 = Math.max(0, distancePx - 2);
              const d2 = Math.min(pathLengthPx, distancePx + 2);
              const p1 = path.getPointAtLength(d1);
              const p2 = path.getPointAtLength(d2 === d1 ? Math.min(pathLengthPx, d1 + 1) : d2);
              return Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI + 90;
            };

            const animateRoute = (timestamp) => {
              const elapsedSec = (timestamp - animationStart) / 1000;
              const travelPx = (elapsedSec * SPEED_PX_PER_SEC) % pathLengthPx;
              const dashOffsetPx = -(elapsedSec * SPEED_PX_PER_SEC) % FLOW_DASH_PATTERN_PX;
              flowPath.style.strokeDashoffset = `${dashOffsetPx}px`;

              for (let i = 0; i < movingArrowMarkers.length; i++) {
                const item = movingArrowMarkers[i];
                const distancePx = (item.offsetPx + travelPx) % pathLengthPx;
                const p = flowPath.getPointAtLength(distancePx);
                const angle = getAngleAtPathPx(flowPath, distancePx);
                item.arrowEl.setAttribute("transform", `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${angle.toFixed(1)})`);
              }

              routeAnimationId = requestAnimationFrame(animateRoute);
            };

            routeAnimationId = requestAnimationFrame(animateRoute);
          }
        }

        // Add 3D High-Contrast Neon numbered waypoint badges on map (Phương án 5)
        routeOrderKeys.forEach((key, idx) => {
          const order = lastOrders.find(o => getOrderKey(o) === key);
          if (order) {
            const lat = toNumber(order.latitude);
            const lng = toNumber(order.longitude);
            if (lat !== null && lng !== null) {
              const badgeIcon = L.divIcon({
                className: "",
                html: `<div class="waypoint-badge-marker">${idx + 1}</div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 17]
              });
              const badgeMarker = L.marker([lat, lng], {
                icon: badgeIcon,
                zIndexOffset: 3000
              }).addTo(routeLayerGroup);

              badgeMarker.on("click", () => {
                const ordMarker = orderLayer.getLayers().find(m => {
                  const pos = m.getLatLng();
                  return Math.abs(pos.lat - lat) < 0.00001 && Math.abs(pos.lng - lng) < 0.00001;
                });
                if (ordMarker) {
                  ordMarker.openPopup();
                }
              });
            }
          }
        });

        const totalDistKm = (route.distance / 1000).toFixed(1);
        const totalMins = Math.round(route.duration / 60);
        const totalTimeStr = totalMins < 60 ? `~${totalMins} phút` : `~${Math.floor(totalMins / 60)}g${totalMins % 60}p`;

        if (els.routeTotalDist) els.routeTotalDist.textContent = `${totalDistKm} km`;
        if (els.routeTotalTime) els.routeTotalTime.textContent = totalTimeStr;

        if (els.routeLegsList && Array.isArray(route.legs)) {
          els.routeLegsList.innerHTML = "";
          route.legs.forEach((leg, idx) => {
            const fromLabel = waypointLabels[idx] || `Điểm ${idx + 1}`;
            const toLabel = waypointLabels[idx + 1] || `Điểm ${idx + 2}`;
            const legDist = leg.distance < 1000 ? `${Math.round(leg.distance)}m` : `${(leg.distance / 1000).toFixed(1)}km`;
            const legMins = Math.max(1, Math.round(leg.duration / 60));

            const isSingleOrderLeg = route.legs.length === 1 && routeOrderKeys.length >= 2;
            const isOrderToOrderLeg = fromLabel.startsWith("Đơn #") && toLabel.startsWith("Đơn #");
            const showSwapBtn = isSingleOrderLeg || isOrderToOrderLeg || (idx === 0 && routeOrderKeys.length >= 2 && route.legs.length <= 2);

            const row = document.createElement("div");
            row.className = "route-leg-row";
            row.innerHTML = `
              <span class="route-leg-label">${escapeHtml(fromLabel)} ➔ ${escapeHtml(toLabel)}</span>
              ${showSwapBtn ? `
                <button type="button" class="route-swap-inline-btn" onclick="reverseRouteOrders()" title="Đảo ngược thứ tự giao (${escapeHtml(toLabel)} ➔ ${escapeHtml(fromLabel)})">
                  ⇄ Đảo chiều
                </button>
              ` : `<span></span>`}
              <b class="route-leg-stat">${legDist} (~${legMins}p)</b>
            `;
            els.routeLegsList.appendChild(row);
          });
        }

        if (els.routeSummaryBox) els.routeSummaryBox.classList.remove("hidden");
        return true;
      } catch (err) {
        console.warn("Lỗi tính lộ trình:", err);
        return false;
      }
    }

    function getShipperKey(shipper) {

      );
    }

    function getShipperSeenAt(shipper) {
      return shipper?.last_seen_at || shipper?.updated_at || shipper?.created_at || "";
    }

    function formatRelativeTime(value) {
      if (!value) return "";

      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "";

      const seconds = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
      if (seconds < 60) return `${seconds}s`;

      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}p`;

      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}g`;

      return `${Math.floor(hours / 24)}n`;
    }

    function isShipperVisible(shipper) {
      const key = getShipperKey(shipper);
      if (!shipperVisibility.has(key)) {

    }

    const shipperMarkers = new Map();
    let activeFollowShipperKey = null;

    function focusShipper(shipper) {

    function renderShipperFilter(shippers) {

        icon.innerHTML = online
          ? '<img src="shipper-car-side.png" alt="car" class="shipper-side-car-img" />'
          : '<span style="font-size:12px;opacity:0.5;">⚪</span>';

          label.appendChild(etaEl);

    const shipperPrevPositions = new Map();
    const shipperEtaCache = new Map();

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = deg => (deg * Math.PI) / 180;
      const toDeg = rad => (rad * 180) / Math.PI;

      const φ1 = toRad(lat1);
      const φ2 = toRad(lat2);
      const Δλ = toRad(lon2 - lon1);

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x =
        Math.cos(φ1) * Math.sin(φ2) -
        Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);

      const θ = Math.atan2(y, x);
      return (toDeg(θ) + 360) % 360;
    }

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = deg => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    async function getShipperEta(shipper, lat, lng) {
      if (lat === null || lng === null) return null;

      const key = getShipperKey(shipper);
      const straightDist = calculateDistanceMeters(lat, lng, RESTAURANT.lat, RESTAURANT.lng);

      // Khuôn viên trung tâm thương mại HEP (bãi đỗ xe, Kaufland, lối vào): bán kính ~220m
      if (straightDist <= 220) {
        return {
          atRestaurant: true,
          distanceMeters: straightDist,
          durationSeconds: 0,
          etaText: "Tại quán",
          etaFullText: "Đang ở quán",
          distText: `${Math.round(straightDist)} m`
        };
      }

      const cached = shipperEtaCache.get(key);
      const now = Date.now();

      // Nếu vị trí di chuyển dưới 25m và cache trong vòng 60s -> dùng lại cache
      if (cached && cached.lat != null && cached.lng != null) {
        const moved = calculateDistanceMeters(cached.lat, cached.lng, lat, lng);
        if (moved < 25 && (now - cached.timestamp < 60000)) {
          return cached.data;
        }
      }

      let routeData = null;
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${lng},${lat};${RESTAURANT.lng},${RESTAURANT.lat}?overview=false`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data && data.code === "Ok" && Array.isArray(data.routes) && data.routes.length > 0) {
            const route = data.routes[0];
            routeData = {
              distanceMeters: route.distance,
              durationSeconds: route.duration
            };
          }
        }
      } catch (err) {
        // Fallback sang công thức ước lượng nếu OSRM bị timeout / lỗi mạng
      }

      if (!routeData) {
        const estDistance = straightDist * 1.35;
        const estSpeedMs = (32 * 1000) / 3600;
        routeData = {
          distanceMeters: estDistance,
          durationSeconds: Math.max(30, estDistance / estSpeedMs)
        };
      }

      // Lọc thông minh khi xe đã ở cự ly gần quán (< 450m) để loại bỏ các khúc cua vòng vo do dải phân cách/đường nội bộ
      if (straightDist < 450 && routeData.distanceMeters > straightDist * 1.8) {
        const localDist = straightDist * 1.25;
        routeData = {
          distanceMeters: localDist,
          durationSeconds: Math.max(25, localDist / ((25 * 1000) / 3600))
        };
      }

      const mins = Math.round(routeData.durationSeconds / 60);
      let etaText = mins <= 1 ? "~1p" : mins < 60 ? `~${mins}p` : `${Math.floor(mins / 60)}g${mins % 60}p`;
      let etaFullText = mins <= 1 ? "~1 phút" : mins < 60 ? `~${mins} phút` : `~${Math.floor(mins / 60)} giờ ${mins % 60} phút`;
      let distText = routeData.distanceMeters < 1000
        ? `${Math.round(routeData.distanceMeters)} m`
        : `${(routeData.distanceMeters / 1000).toFixed(1)} km`;

      const result = {
        atRestaurant: false,
        distanceMeters: routeData.distanceMeters,
        durationSeconds: routeData.durationSeconds,
        etaText,
        etaFullText,
        distText
      };

      shipperEtaCache.set(key, {
        lat,
        lng,
        timestamp: now,
        data: result
      });

      return result;
    }

    function normalizeContinuousAngle(currentAngle, targetAngle) {
      let delta = (targetAngle - (currentAngle % 360) + 540) % 360 - 180;
      return currentAngle + delta;
    }

    function getShipperBearing(shipper, lat, lng) {
      const key = getShipperKey(shipper);
      const speed = toNumber(shipper.speed);
      const prev = shipperPrevPositions.get(key);

      // 1. Nếu API có sẵn heading/bearing/angle từ GPS thiết bị
      const apiHeading = toNumber(shipper.heading ?? shipper.bearing ?? shipper.angle ?? shipper.course);
      if (apiHeading !== null && apiHeading >= 0) {
        if (!prev) {
          shipperPrevPositions.set(key, { lat, lng, bearing: apiHeading, continuousBearing: apiHeading });
          return apiHeading;
        }

        // Nếu xe đang dừng hoặc chạy quá chậm (< 4 km/h), giữ nguyên hướng cũ
        if (speed !== null && speed < 4) {
          shipperPrevPositions.set(key, { ...prev, lat, lng });
          return prev.continuousBearing ?? prev.bearing ?? 0;
        }

        const newContinuous = normalizeContinuousAngle(prev.continuousBearing ?? prev.bearing ?? 0, apiHeading);
        shipperPrevPositions.set(key, { lat, lng, bearing: apiHeading, continuousBearing: newContinuous });
        return newContinuous;
      }

      // 2. Tính toán dựa trên tọa độ GPS trước đó (Anti-jitter filter)
      if (!prev) {
        shipperPrevPositions.set(key, { lat, lng, bearing: 0, continuousBearing: 0 });
        return 0;
      }

      const dist = calculateDistanceMeters(prev.lat, prev.lng, lat, lng);

      // Quy tắc chống rung:
      // - Nếu có tốc độ và tốc độ < 5 km/h: xe dừng/đi bộ -> KHÔNG xoay
      // - Nếu không có thông tin tốc độ: cần di chuyển tối thiểu 12m để lọc GPS drift
      // - Nếu có tốc độ >= 5 km/h: cần di chuyển tối thiểu 6m
      const isMoving = speed !== null ? (speed >= 5 && dist >= 6) : (dist >= 12);

      if (isMoving) {
        const rawBearing = calculateBearing(prev.lat, prev.lng, lat, lng);
        const currentContinuous = prev.continuousBearing ?? prev.bearing ?? 0;
        const newContinuous = normalizeContinuousAngle(currentContinuous, rawBearing);

        shipperPrevPositions.set(key, {
          lat,
          lng,
          bearing: rawBearing,
          continuousBearing: newContinuous
        });
        return newContinuous;
      }

      // Không đủ điều kiện di chuyển -> giữ nguyên góc cũ, tránh giật góc tại chỗ
      return prev.continuousBearing ?? prev.bearing ?? 0;
    }

    function renderShippers(shippers) {
      shipperLayer.clearLayers();
      shipperMarkers.clear();

      shippers.forEach(shipper => {
        if (!isShipperVisible(shipper)) return;

        const lat = toNumber(shipper.latitude ?? shipper.lat);
        const lng = toNumber(shipper.longitude ?? shipper.lng ?? shipper.lon);
        if (lat === null || lng === null) return;

        const name = shipper?.user?.name || shipper?.name || "Shipper";
        const online = shipper?.is_online === true;
        const bearing = getShipperBearing(shipper, lat, lng);
        const eta = shipper._eta;

        const icon = L.divIcon({
          className: "shipper-car-marker",
          html: `
            <div class="shipper-car-body ${online ? "" : "shipper-car-offline"}" style="transform: rotate(${Math.round(bearing)}deg);">
              <img src="shipper-car-top.png" alt="car" class="shipper-car-img" />
            </div>
          `,
          iconSize: [16, 32],
          iconAnchor: [8, 16]
        });

        let etaPopupHtml = "";
        if (online && eta) {
          if (eta.atRestaurant) {
            etaPopupHtml = `<div class="popup-line" style="color:#179b4c;font-weight:700;">📍 Đang ở quán</div>`;
          } else {
            etaPopupHtml = `
              <div class="popup-line"><b>Về quán:</b> ${escapeHtml(eta.etaFullText)}</div>
              <div class="popup-line"><b>Khoảng cách:</b> ${escapeHtml(eta.distText)}</div>
            `;
          }
        }

        const popup = `
          <div>
            <div class="popup-title">${escapeHtml(name)}</div>
            <div class="popup-line"><b>Tốc độ:</b> ${escapeHtml(shipper.speed ?? 0)} km/h</div>
            ${etaPopupHtml}
            <div class="popup-line" style="color:#888;font-size:11px;margin-top:4px;">Cập nhật: ${escapeHtml(formatRelativeTime(getShipperSeenAt(shipper)))}</div>
          </div>
        `;

        const marker = L.marker([lat, lng], {
          icon,
          zIndexOffset: 2000
        })
          .bindPopup(popup, { autoPan: false })
          .addTo(shipperLayer);

        marker.on("click", () => {
          const key = getShipperKey(shipper);
          routeStartType = `shipper:${key}`;
          routeReturnToShop = false;
          isRoutingArmed = true;
          lastInteractedOrderKey = null;
          updateRouteReadyOrderMarkerUi();
          if (routeOrderKeys.length > 0) {
            calculateAndDrawRoute();
            toggleRoutePanel(true);
          }
        });

        shipperMarkers.set(getShipperKey(shipper), marker);
      });

      // Nếu đang bật chế độ bám đuôi, tự động cuộn bản đồ theo vị trí mới nhất của xe và giữ mở bảng thông tin
      if (activeFollowShipperKey) {
        const activeMarker = shipperMarkers.get(activeFollowShipperKey);
        if (activeMarker) {
          const latLng = activeMarker.getLatLng();
          map.panTo(latLng, { animate: true, duration: 1 });
          activeMarker.openPopup();
        }
      }

      updateFollowUi();
    }

    async function loadShippers() {
      const payload = await fetchJson(`${API_BASE}/shipper-locations`);
      const shippers = unwrapList(payload);

      lastShippers = shippers;

      await Promise.all(
        shippers.map(async shipper => {
          const lat = toNumber(shipper.latitude ?? shipper.lat);
          const lng = toNumber(shipper.longitude ?? shipper.lng ?? shipper.lon);
          if (lat !== null && lng !== null && shipper.is_online === true) {
            shipper._eta = await getShipperEta(shipper, lat, lng);
          } else {
            shipper._eta = null;
          }
        })
      );

      renderShipperStatus(shippers);
      renderShipperFilter(shippers);
      renderShippers(shippers);
      if (typeof calculateAndDrawRoute === "function" && routeStartType && routeStartType.startsWith("shipper:") && routeOrderKeys.length > 0) {
        calculateAndDrawRoute();
      }

      return shippers;
    }


    let lastRefreshCompletedAt = 0;
    let refreshPending = false;

    async function refreshAll(force = false) {
      if (!appUnlocked) return;
      if (refreshing) {
        if (force) {
          refreshPending = true;
        }
        return;
      }
      const now = Date.now();
      // Nếu không bắt buộc và vừa refresh cách đây dưới 3.5s, bỏ qua để tránh trùng request
      if (!force && (now - lastRefreshCompletedAt < 3500)) return;

      refreshing = true;
      els.reloadButton.classList.add("loading");
      els.reloadButton.disabled = true;
      els.lastUpdate.textContent = "Đang tải...";

      try {
        const isStillValid = await syncLatestPassword();
        if (!isStillValid || !hasSavedAccess()) {
          return;
        }

        await Promise.all([loadOrders(), loadShippers()]);

        els.lastUpdate.textContent =
          new Date().toLocaleTimeString("vi-VN", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          });
        lastRefreshCompletedAt = Date.now();
      } catch (err) {
        console.error("Lỗi cập nhật dữ liệu:", err);
        els.lastUpdate.textContent = "Lỗi";
      } finally {
        refreshing = false;
        els.reloadButton.classList.remove("loading");
        els.reloadButton.disabled = false;
        if (refreshPending) {
          refreshPending = false;
          refreshAll(true);
        }
      }
    }

    function startPolling(options = {}) {
      stopPolling();
      if (options.resetView) {
        resetMapToRestaurant();
      }
      refreshAll(true);
      refreshTimer = setInterval(() => {
        refreshAll(false);
      }, REFRESH_MS);
    }

    function stopPolling() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
    }

    let resumeDebounceTimer = null;
    function triggerAppResume() {
      if (resumeDebounceTimer) clearTimeout(resumeDebounceTimer);
      resumeDebounceTimer = setTimeout(() => {
        if (!document.hidden) {
          handleAppResume();
        }
      }, 250);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        lastHiddenAt = Date.now();
        stopPolling();
      } else {
        triggerAppResume();
      }
    });

    window.addEventListener("pageshow", event => {
      if (!document.hidden) {
        if (event.persisted) {
          window.location.reload();
          return;
        }
        triggerAppResume();
      }
    });

    window.addEventListener("focus", () => {
      if (!document.hidden) {
        triggerAppResume();
      }
    });

    (() => {
      if (hasSavedAccess()) {
        unlockApp();
      } else {
        lockApp();
      }
      syncLatestPassword();
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(reg => {
          reg.update();
        }).catch(err => {
          console.warn("Service Worker không đăng ký được:", err);
        });
      });
    }
  </script>

</body>
